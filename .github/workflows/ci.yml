name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Static market data validation
        run: npm run data:check
      - name: Strict Korean market data validation
        run: npm run data:kr:check
      - name: Strict U.S. market data validation
        run: npm run data:us:check
      - name: Static market index validation
        run: npm run data:indices:check
      - name: Static FX data validation
        run: npm run data:fx:check
      - name: Static BOK base-rate validation
        run: npm run data:rates:check
      - name: Static corporate-event validation
        run: npm run data:events:check
      - name: Static news validation
        run: npm run data:news:check
      - name: Historical data coverage report
        run: npm run data:coverage
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Responsive interaction tests
        run: npm run test:e2e
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-ui-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore

  finalize-release-changelog:
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Insert v0.23.0 changelog entry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          if '## [0.23.0] - 2026-08-27' in text:
              raise SystemExit(0)

          entry = '''## [0.23.0] - 2026-08-27

### Added
- Added KOSPI, KOSDAQ, Nasdaq Composite, and an explicit Dow Jones official-source status card to the home `오늘의 시장` summary, with signed point and percentage changes using the existing red gain / blue loss tokens.
- Added committed official major-index histories, strict schema/calendar coverage validation, source-specific ingestion, runtime loading, pure no-lookahead quote selection, unit coverage, and responsive E2E regressions.

### Changed
- Major-index values now follow the persisted game session phase: latest completed close before market open, actual opening index after `장 시작`, and actual closing index after `장 마감`; closed-market dates stay on the latest completed close without reading future bars.
- Korean index history uses official KRX Indices data and Nasdaq Composite uses Nasdaq Historical Quotes. Dow Jones remains an explicit unsupported-source card rather than mixing a proxy or third-party series.
- App version advanced to `v0.23.0`; save schema remains v11 and tradable asset OHLC, order execution, portfolio valuation, settlement, FX, corporate actions, and existing saves are unchanged.

'''
          marker = '## [Unreleased]\n\n'
          if marker not in text:
              raise SystemExit('Unreleased marker not found')
          path.write_text(text.replace(marker, marker + entry, 1), encoding='utf-8')
          PY
      - name: Commit changelog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'CHANGELOG.md is already finalized.'
            exit 0
          fi
          git commit -m 'docs: finalize v0.23.0 changelog'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
