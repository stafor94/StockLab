name: Bootstrap private Nasdaq U.S. history

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  build-us-history:
    if: github.head_ref == 'feature/v0.15.0-us-nasdaq-history'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate ephemeral mapping certificate
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:4096 \
            -keyout /tmp/nasdaq-map-key.pem \
            -out /tmp/nasdaq-map-cert.pem \
            -days 1 -nodes \
            -subj '/CN=StockLab ephemeral Nasdaq mapping/' >/dev/null 2>&1

      - name: Publish ephemeral certificate to PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          cert="$(base64 -w0 /tmp/nasdaq-map-cert.pem)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --method POST \
            -f body="NASDAQ_MAP_CERT_V1:${cert}" >/dev/null

      - name: Receive encrypted private source map
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          prefix='NASDAQ_MAP_CMS_V1:'
          encrypted=''
          for attempt in $(seq 1 120); do
            body="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq '[.[] | select(.body | startswith("NASDAQ_MAP_CMS_V1:"))] | last | .body // ""')"
            if [[ "$body" == "$prefix"* ]]; then
              encrypted="${body#${prefix}}"
              break
            fi
            sleep 5
          done
          if [[ -z "$encrypted" ]]; then
            echo 'Encrypted private source map was not supplied to this PR.' >&2
            exit 1
          fi
          mkdir -p .private
          printf '%s' "$encrypted" | base64 -d >/tmp/nasdaq-map.cms
          openssl cms -decrypt -binary -inform DER \
            -recip /tmp/nasdaq-map-cert.pem \
            -inkey /tmp/nasdaq-map-key.pem \
            -in /tmp/nasdaq-map.cms \
            -out .private/market-source-map.json
          chmod 600 .private/market-source-map.json
          node -e "const j=JSON.parse(require('fs').readFileSync('.private/market-source-map.json','utf8')); if(Object.keys(j.assets||{}).filter(id=>/^U/.test(id)).length!==57) process.exit(2)"

      - name: Build Nasdaq Historical Quotes dataset
        env:
          NASDAQ_REQUEST_DELAY_MS: '100'
        run: npm run data:us:build -- --from=2018-01-01 --to=2026-08-25

      - name: Validate U.S. strict coverage
        run: npm run data:us:check

      - name: Run repository quality gates
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm test
          npm run data:check
          npm run data:fx:check
          npm run data:rates:check
          npm run data:events:check
          npm run data:news:check
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Commit generated masked data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data
          if git diff --cached --quiet; then
            echo 'No generated data changes to commit.'
          else
            git commit -m 'data: populate Nasdaq U.S. history'
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Remove ephemeral private inputs
        if: always()
        shell: bash
        run: |
          rm -rf .private
          rm -f /tmp/nasdaq-map.cms /tmp/nasdaq-map-key.pem /tmp/nasdaq-map-cert.pem
