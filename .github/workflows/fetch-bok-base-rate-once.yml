name: Fetch BOK base rate once

on:
  push:
    branches: [data/complete-bok-base-rate-history]
    paths: [.github/workflows/fetch-bok-base-rate-once.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify ECOS series metadata
        env:
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BOK_ECOS_API_KEY" || { echo 'BOK_ECOS_API_KEY secret is required' >&2; exit 1; }
          node --input-type=module <<'NODE'
          const key = process.env.BOK_ECOS_API_KEY
          const response = await fetch(`https://ecos.bok.or.kr/api/StatisticItemList/${encodeURIComponent(key)}/json/kr/1/100/722Y001`)
          if (!response.ok) throw new Error(`ECOS StatisticItemList HTTP ${response.status}`)
          const payload = await response.json()
          const rows = payload?.StatisticItemList?.row
          if (!Array.isArray(rows)) throw new Error(payload?.RESULT?.MESSAGE ?? 'ECOS StatisticItemList returned no rows')
          const item = rows.find((row) => row.ITEM_CODE === '0101000' && row.CYCLE === 'D')
          if (!item) throw new Error('ECOS 722Y001 has no daily item 0101000')
          if (item.ITEM_NAME !== '한국은행 기준금리') throw new Error(`Unexpected ECOS item name: ${item.ITEM_NAME}`)
          console.log(`Verified ECOS ${item.STAT_CODE}/${item.ITEM_CODE}: ${item.ITEM_NAME} (${item.CYCLE}, ${item.START_TIME}..${item.END_TIME})`)
          NODE
      - name: Build official BOK base-rate history
        env:
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
        run: npm run data:rates:build -- --from=2018-01-01 --to=2026-08-25 --force
      - name: Validate generated base rates
        run: npm run data:rates:check
      - name: Commit generated dataset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/rates/bok-base-rate.json
          git diff --cached --quiet && { echo 'No rate changes generated'; exit 0; }
          git commit -m 'data: populate official BOK base-rate history'
          git push origin HEAD:data/complete-bok-base-rate-history
