name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Static market data validation
        run: npm run data:check
      - name: Strict Korean market data validation
        run: npm run data:kr:check
      - name: Strict U.S. market data validation
        run: npm run data:us:check
      - name: Static FX data validation
        run: npm run data:fx:check
      - name: Static BOK base-rate validation
        run: npm run data:rates:check
      - name: Static corporate-event validation
        run: npm run data:events:check
      - name: Static news validation
        run: npm run data:news:check
      - name: Historical data coverage report
        run: npm run data:coverage
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Responsive interaction tests
        run: npm run test:e2e
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-ui-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore

  generate-market-indices:
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Restore official-index fetch cache
        uses: actions/cache@v4
        with:
          path: .cache/market-index-data
          key: market-index-data-${{ hashFiles('public/data/calendars/*.json') }}
      - name: Generate supported official market indices
        shell: bash
        run: |
          set -euo pipefail
          if [ -f public/data/indices/manifest.json ]; then
            npm run data:indices:check
            echo 'Committed market-index files are already valid.'
            exit 0
          fi
          KRX_INDEX_CONCURRENCY=2 KRX_INDEX_REQUEST_DELAY_MS=100 npm run data:indices:build
          npm run data:indices:check
      - name: Commit generated market indices
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/indices
          if git diff --cached --quiet; then
            echo 'Official market-index files are already current.'
            exit 0
          fi
          git commit -m 'data: add supported official major indices'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
