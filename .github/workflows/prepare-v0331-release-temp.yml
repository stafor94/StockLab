name: Prepare v0.33.1 release metadata (temporary)

on:
  push:
    branches: [validation/keyless-market-cap-97-final]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/keyless-market-cap-97
          fetch-depth: 0
      - name: Verify expected feature HEAD
        run: |
          test "$(git rev-parse HEAD)" = "a26e35a19202282a0890152d5f26df85081297ae"
      - name: Add v0.33.1 changelog section
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '## [Unreleased]\n'
          release = '''## [0.33.1] - 2026-09-01

          ### Changed
          - Reworked historical market-cap build inputs so Korean listed-share history uses official KRX KIND data without requiring a KRX Open API key, while preserving the existing unadjusted KRX/Nasdaq price authorities.
          - Added tracked verified SEC shares-outstanding snapshots for supported U.S. stocks; the market-cap builder uses verified snapshots first and falls back to SEC Company Facts only when a tracked snapshot is unavailable.
          - Added source-map/private-identity validation and regression coverage for the keyless market-cap and verified SEC snapshot paths.
          - App version advanced to `v0.33.1`; save schema remains v13 and trading, settlement, portfolio, corporate-action, price, FX/rate, and market-progression economics are unchanged.

          '''
          if '## [0.33.1] - 2026-09-01' in text:
              raise SystemExit('v0.33.1 changelog section already exists')
          if marker not in text:
              raise SystemExit('Unreleased marker not found')
          path.write_text(text.replace(marker, marker + '\n' + release, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- CHANGELOG.md
      - name: Commit release metadata to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: release v0.33.1"
          git push origin HEAD:feature/keyless-market-cap-97
