name: Finalize v0.17.0 changelog

on:
  push:
    branches: [feature/v0.17.0-us-nasdaq-history]
    paths:
      - '.github/workflows/release-changelog-v017.yml'

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/v0.17.0-us-nasdaq-history
          fetch-depth: 0
      - name: Insert release entry without rewriting history
        env:
          RELEASE_ENTRY_B64: 
        shell: bash
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          marker = '## [Unreleased]\n'
          entry = base64.b64decode(os.environ['RELEASE_ENTRY_B64']).decode()
          if '## [0.17.0]' not in text:
              if marker not in text:
                  raise SystemExit('Unreleased marker missing')
              path.write_text(text.replace(marker, marker + '\n' + entry, 1))
          PY
      - name: Commit changelog and remove one-run workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/release-changelog-v017.yml
          git add CHANGELOG.md
          git commit -m 'docs: record v0.17.0 Nasdaq market release'
          git push origin HEAD:feature/v0.17.0-us-nasdaq-history
