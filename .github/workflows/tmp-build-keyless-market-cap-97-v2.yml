  <tbody>
    <tr><td>주권</td><td>샘플우선주</td><td>KR7111112000</td><td>2001-01-01</td><td>822,887</td></tr>
    <tr><td>주권</td><td>샘플보통주</td><td>KR7111111000</td><td>2000-01-01</td><td>5,969,783</td></tr>
