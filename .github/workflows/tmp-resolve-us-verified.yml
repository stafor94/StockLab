name: Resolve verified US tracked mappings

on:
  push:
    branches: [feature/keyless-market-cap-97]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-us:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Configure persistence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Resolve and checkpoint verified U.S. mappings
        run: npx tsx .github/tmp-resolve-us-verified.ts

      - name: Verify all 97 tracked mappings
        run: |
          node - <<'NODE'
          const map = require('./config/market-source-map.json')
          const entries = Object.entries(map.assets)
          const kr = entries.filter(([id]) => /^K\d{3}$/.test(id) || /^KE\d{3}$/.test(id))
          const us = entries.filter(([id]) => /^U\d{3}$/.test(id))
          const badKr = kr.filter(([, source]) => source.symbol === '000000')
          const badUs = us.filter(([, source]) => source.symbol === 'DUMMY')
          if (kr.length !== 52 || us.length !== 45 || badKr.length || badUs.length) {
            throw new Error(`Tracked mapping incomplete: KR=${kr.length - badKr.length}/52 US=${us.length - badUs.length}/45`)
          }
          console.log('Tracked source map contains all 97 supported mappings.')
          NODE
