name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Static market data validation
        run: npm run data:check
      - name: Strict Korean market data validation
        run: npm run data:kr:check
      - name: Strict U.S. market data validation
        run: npm run data:us:check
      - name: Static FX data validation
        run: npm run data:fx:check
      - name: Static BOK base-rate validation
        run: npm run data:rates:check
      - name: Static corporate-event validation
        run: npm run data:events:check
      - name: Static news validation
        run: npm run data:news:check
      - name: Historical data coverage report
        run: npm run data:coverage
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Responsive interaction tests
        run: npm run test:e2e
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-ui-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore

  generate-market-indices:
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate official market indices
        run: npm run data:indices:build
      - name: Validate generated market indices
        run: npm run data:indices:check
      - name: Record v0.23.0 changelog
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'CHANGELOG.md'
          const marker = '## [Unreleased]\n'
          const release = `\n## [0.23.0] - 2026-08-27\n\n### Added\n- Added KOSPI, KOSDAQ, and Nasdaq Composite to the home \`오늘의 시장\` summary with dedicated runtime index data separate from tradable asset histories.\n- Added official KRX Data Marketplace and Nasdaq Historical Quotes index ingestion, strict calendar/carry-in validation, runtime schema/client coverage, and pure quote-selection regressions.\n\n### Changed\n- Major-index values now follow the no-lookahead session boundary: latest completed close before open, actual open after \`장 시작\`, and actual close after \`장 마감\`, with signed point/% change versus the previous completed close.\n- Index gains reuse the existing red gain token and losses reuse the blue loss token while retaining signed text so color is not the only cue.\n- App version advanced to \`v0.23.0\`; save schema remains v11 and index data does not alter execution prices, portfolio valuation, settlement, fees, taxes, FX, or corporate actions.\n`
          const current = fs.readFileSync(path, 'utf8')
          if (!current.includes('## [0.23.0] - 2026-08-27')) {
            if (!current.includes(marker)) throw new Error('Unreleased changelog marker not found')
            fs.writeFileSync(path, current.replace(marker, marker + release), 'utf8')
          }
          NODE
      - name: Commit generated market indices
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/indices CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'Official market-index files and changelog are already current.'
            exit 0
          fi
          git commit -m 'data: add official major market indices'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
