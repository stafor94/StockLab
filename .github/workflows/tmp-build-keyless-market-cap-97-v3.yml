name: Build supported market-cap history v19

on:
  push:
    branches: [feature/keyless-market-cap-97]

permissions:
  contents: write
  issues: write

jobs:
  build-market-cap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      KRX_KIND_REQUEST_DELAY_MS: '120'
      NASDAQ_REQUEST_DELAY_MS: '100'
      SEC_REQUEST_DELAY_MS: '120'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Patch one-shot private transport and resolver
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/tmp-market-cap-bootstrap.sh')
          text = path.read_text()

          cleanup_old = '''cleanup_private() {
            rm -rf .private "${RUNNER_TEMP:-/tmp}/market-cap-private" .cache
          }
          trap cleanup_private EXIT'''
          cleanup_new = '''erase_current_ciphertext() {
            local endpoint="repos/${GITHUB_REPOSITORY}/issues/82/comments"
            local prefix="MARKET_CAP_MAP_CMS_V2:${GITHUB_RUN_ID}:"
            local ids
            ids="$(gh api "$endpoint" --paginate --jq ".[] | select(.body | startswith(\\"${prefix}\\")) | .id" 2>/dev/null || true)"
            for id in $ids; do
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" \\
                -f body='Encrypted bootstrap payload has been consumed and removed.' >/dev/null 2>&1 || true
            done
          }
          cleanup_private() {
            erase_current_ciphertext || true
            unset MARKET_SOURCE_MAP_JSON || true
            rm -rf .private "${RUNNER_TEMP:-/tmp}/market-cap-private" .cache
          }
          trap cleanup_private EXIT'''
          if cleanup_old not in text:
              raise SystemExit('private cleanup insertion point missing')
          text = text.replace(cleanup_old, cleanup_new, 1)

          marker = "echo 'Fresh encrypted 97-asset private market map decrypted successfully.'\n\ncat > .private/verify-reconstructed-map.ts <<'TS'"
          replacement = "erase_current_ciphertext\necho 'Fresh encrypted 97-asset private market map decrypted successfully.'\nnpx tsx .github/tmp-resolve-market-map.ts\n\ncat > .private/verify-reconstructed-map.ts <<'TS'"
          if marker not in text:
              raise SystemExit('private resolver insertion point missing')
          text = text.replace(marker, replacement, 1)

          old_transport = '''prefix="MARKET_CAP_MAP_CMS_V1:${GITHUB_RUN_ID}:"
          endpoint="repos/${GITHUB_REPOSITORY}/issues/82/comments"
          payload=''
          for _ in $(seq 1 360); do
            payload="$(gh api "$endpoint" --paginate --jq "[.[] | select(.body | startswith(\\"${prefix}\\")) | .body] | last // \\"\\"" || true)"
            if [ -n "$payload" ]; then break; fi
            sleep 5
          done
          test -n "$payload" || { echo 'Fresh encrypted market-cap map comment was not supplied.' >&2; exit 1; }
          mkdir -p .private
          printf '%s' "${payload#${prefix}}" | tr -d '\\r\\n ' | base64 -d > "$RUNNER_TEMP/market-cap-private/map.cms"'''
          new_transport = '''prefix="MARKET_CAP_MAP_CMS_V2:${GITHUB_RUN_ID}:"
          endpoint="repos/${GITHUB_REPOSITORY}/issues/82/comments"
          payload=''
          for _ in $(seq 1 360); do
            payload=''
            complete=true
            for index in 1 2 3 4; do
              part_prefix="${prefix}${index}/4:"
              part="$(gh api "$endpoint" --paginate --jq "[.[] | select(.body | startswith(\\"${part_prefix}\\")) | .body] | last // \\"\\"" || true)"
              if [ -z "$part" ]; then complete=false; break; fi
              payload+="${part#${part_prefix}}"
            done
            if [ "$complete" = true ]; then break; fi
            sleep 5
          done
          test -n "$payload" || { echo 'Fresh encrypted market-cap map chunks were not supplied.' >&2; exit 1; }
          mkdir -p .private
          printf '%s' "$payload" | tr -d '\\r\\n ' | base64 -d > "$RUNNER_TEMP/market-cap-private/map.cms"'''
          if old_transport not in text:
              raise SystemExit('private transport insertion point missing')
          text = text.replace(old_transport, new_transport, 1)

          publish_marker = "echo 'Published fresh one-run market-cap encryption certificate.'\n\nprefix=\"MARKET_CAP_MAP_CMS_V1:${GITHUB_RUN_ID}:\""
          sender = r'''echo 'Published fresh one-run market-cap encryption certificate.'

test -n "${MARKET_SOURCE_MAP_JSON:-}" || { echo 'Private market source secret is unavailable.' >&2; exit 1; }
sender_json="$RUNNER_TEMP/market-cap-private/sender-map.json"
sender_cms="$RUNNER_TEMP/market-cap-private/sender-map.cms"
python3 - <<'PYMAP'
import json, os
from pathlib import Path
source = json.loads(os.environ['MARKET_SOURCE_MAP_JSON'])
assets = source.get('assets')
if not isinstance(assets, dict): raise SystemExit('Private market source secret has an invalid structure.')
ids = [*(f'K{i:03d}' for i in range(1, 41)), *(f'E{i:03d}' for i in range(1, 13)), *(f'U{i:03d}' for i in range(1, 46))]
if any(asset_id not in assets for asset_id in ids): raise SystemExit('Private market source secret is missing a supported asset slot.')
filtered = {'schemaVersion': 1, 'assets': {asset_id: assets[asset_id] for asset_id in ids}}
path = Path(os.environ['RUNNER_TEMP']) / 'market-cap-private' / 'sender-map.json'
path.write_text(json.dumps(filtered, separators=(',', ':')))
path.chmod(0o600)
print('Prepared exactly 97 supported private source slots for fresh encryption.')
PYMAP
openssl cms -encrypt -binary -aes-256-cbc -outform DER \
  -in "$sender_json" \
  -out "$sender_cms" \
  "$RUNNER_TEMP/market-cap-private/cert.pem"
payload_b64="$(base64 -w0 "$sender_cms")"
chunk_size=$(( (${#payload_b64} + 3) / 4 ))
endpoint="repos/${GITHUB_REPOSITORY}/issues/82/comments"
for index in 1 2 3 4; do
  start=$(( (index - 1) * chunk_size ))
  part="${payload_b64:start:chunk_size}"
  test -n "$part" || { echo 'Encrypted payload chunking failed.' >&2; exit 1; }
  gh api --method POST "$endpoint" \
    -f body="MARKET_CAP_MAP_CMS_V2:${GITHUB_RUN_ID}:${index}/4:${part}" >/dev/null
done
rm -f "$sender_json" "$sender_cms"
unset MARKET_SOURCE_MAP_JSON
echo 'Fresh encrypted 97-asset private market map supplied through issue transport.'

prefix="MARKET_CAP_MAP_CMS_V1:${GITHUB_RUN_ID}:"'''
          if publish_marker not in text:
              raise SystemExit('fresh certificate sender insertion point missing')
          text = text.replace(publish_marker, sender, 1)
          text = text.replace(' && left.volume === right.volume', '')

          old_cleanup = 'git rm -r .bootstrap .github/workflows/tmp-build-keyless-market-cap-97-v3.yml .github/tmp-market-cap-bootstrap.sh'
          new_cleanup = old_cleanup + ' .github/tmp-resolve-market-map.ts'
          if old_cleanup not in text:
              raise SystemExit('temporary cleanup insertion point missing')
          text = text.replace(old_cleanup, new_cleanup, 1)
          path.write_text(text)

          resolver = Path('.github/tmp-resolve-market-map.ts')
          resolver_text = resolver.read_text().replace(' && left.volume === right.volume', '')
          resolver.write_text(resolver_text)
          PY
      - name: Run one-shot market-cap build
        env:
          MARKET_SOURCE_MAP_JSON: ${{ secrets.MARKET_SOURCE_MAP_JSON }}
        run: bash .github/tmp-market-cap-bootstrap.sh
