name: Fix release E2E version (temporary)

on:
  push:
    branches: [validation/keyless-market-cap-97-final]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/keyless-market-cap-97
          fetch-depth: 0
      - name: Verify expected feature HEAD
        run: test "$(git rev-parse HEAD)" = "4bb8d9e777d893a8d49c4fb2907f6eef4de43886"
      - name: Update release version expectation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('e2e/home.spec.ts')
          text = path.read_text(encoding='utf-8')
          old = "await expect(page.getByText('v0.33.0')).toBeVisible()"
          new = "await expect(page.getByText('v0.33.1')).toBeVisible()"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one v0.33.0 home E2E assertion, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- e2e/home.spec.ts
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Commit release E2E update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/home.spec.ts
          git commit -m "test: update expected release version"
          git push origin HEAD:feature/keyless-market-cap-97
