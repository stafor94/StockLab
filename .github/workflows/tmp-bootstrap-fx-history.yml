name: Temporary bootstrap BOK FX history

on:
  push:
    branches:
      - data/complete-bok-fx-history

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: data/complete-bok-fx-history
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build official Bank of Korea USD/KRW history
        env:
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BOK_ECOS_API_KEY" || { echo 'BOK_ECOS_API_KEY secret is required' >&2; exit 1; }
          npm run data:fx:build -- --from=2018-01-01 --to=2026-08-26 --force
          npm run data:fx:check
      - name: Commit generated FX data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/fx/usd-krw.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: bootstrap official BOK USD KRW history'
          git push origin HEAD:data/complete-bok-fx-history
