name: Build tracked market-cap data

on:
  push:
    branches: [feature/keyless-market-cap-97]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-market-cap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MARKET_SOURCE_MAP_PATH: config/market-source-map.json
      KRX_KIND_REQUEST_DELAY_MS: '25'
      SEC_REQUEST_DELAY_MS: '100'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore provider cache
        uses: actions/cache@v4
        with:
          path: .cache/market-data
          key: market-cap-data-${{ runner.os }}-${{ hashFiles('config/market-source-map.json') }}-${{ github.run_id }}
          restore-keys: |
            market-cap-data-${{ runner.os }}-${{ hashFiles('config/market-source-map.json') }}-

      - name: Apply permanent market-cap fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path_name}: expected exactly one patch point')
              path.write_text(text.replace(old, new, 1))

          replace_once(
              'scripts/data/build-market-cap-data.ts',
              "const DEFAULT_SOURCE_MAP_PATH = join(ROOT, '.private', 'market-source-map.json')",
              "const DEFAULT_SOURCE_MAP_PATH = join(ROOT, 'config', 'market-source-map.json')",
          )
          replace_once(
              'scripts/data/build-market-cap-data.ts',
              '  loadMarketSourceMap,\n',
              '  loadMarketCapSourceMap,\n',
          )
          replace_once(
              'scripts/data/build-market-cap-data.ts',
              'const sourceMap = await loadMarketSourceMap(options.sourceMapPath, false)',
              'const sourceMap = await loadMarketCapSourceMap(options.sourceMapPath)',
          )

          source_map = Path('scripts/data/source-map.ts')
          source_map_text = source_map.read_text().rstrip()
          helper = '''

export async function loadMarketCapSourceMap(sourceMapPath: string): Promise<MarketSourceMap> {
  const sourceMap = await loadMarketSourceMap(sourceMapPath, true)
  const supportedAssets = ASSET_CATALOG.filter((asset) => asset.market === 'KR' || (asset.market === 'US' && asset.kind === 'stock'))
  for (const asset of supportedAssets) {
    if (!sourceMap.assets.has(asset.id)) throw new Error(`${asset.id}: market-cap source map is missing a supported asset`)
  }
  return sourceMap
}
'''
          if 'export async function loadMarketCapSourceMap' in source_map_text:
              raise SystemExit('scripts/data/source-map.ts: market-cap helper already exists unexpectedly')
          source_map.write_text(source_map_text + helper)

          replace_once(
              'src/data/ingestion/marketCapShares.ts',
              "function marketCap(price: number, shares: number): number {\n  const value = price * shares\n  if (!Number.isFinite(value) || value <= 0) throw new Error('market-cap calculation produced an invalid value')\n  return value\n}",
              "function marketCap(price: number, shares: number): number {\n  const value = Math.round(price * shares)\n  if (!Number.isSafeInteger(value) || value <= 0) throw new Error('market-cap calculation produced an invalid safe-integer value')\n  return value\n}",
          )

          replace_once(
              'scripts/data/validate-market-cap-data.ts',
              "  if (!Number.isFinite(value) || value <= 0) throw new Error(`${label} must be null or a positive market capitalization`)",
              "  if (!Number.isSafeInteger(value) || value <= 0) throw new Error(`${label} must be null or a positive safe-integer market capitalization`)",
          )

          replace_once(
              'scripts/data/validate-private-identity-leaks.ts',
              "const SOURCE_MAP_PATH = process.env.MARKET_SOURCE_MAP_PATH ?? join(ROOT, '.private', 'market-source-map.json')",
              "const SOURCE_MAP_PATH = process.env.MARKET_SOURCE_MAP_PATH ?? join(ROOT, 'config', 'market-source-map.json')",
          )
          replace_once(
              'scripts/data/validate-private-identity-leaks.ts',
              "  const sensitiveValues = new Set([...sensitive.keys()])\n  const files = await trackedTextFiles(ROOT)",
              "  const sensitiveValues = new Set([...sensitive.keys()])\n  const sourceMapRelative = relative(ROOT, SOURCE_MAP_PATH).replaceAll('\\\\', '/')\n  const files = await trackedTextFiles(ROOT)",
          )
          replace_once(
              'scripts/data/validate-private-identity-leaks.ts',
              "      continue\n    }\n    for (const token of sensitive.values()) {",
              "      continue\n    }\n    if (rel === sourceMapRelative) continue\n    for (const token of sensitive.values()) {",
          )

          changelog = Path('CHANGELOG.md')
          changelog_text = changelog.read_text()
          marker = '## [0.33.0] - 2026-08-28'
          release = '''## [0.33.1] - 2026-08-29

### Fixed
- Completed tracked historical market-cap coverage for 52 Korean assets and 45 supported U.S. stocks while keeping 12 U.S. ETFs intentionally unavailable.
- Made the market-cap builder accept the supported 97-entry tracked source map without relaxing the full 57-asset U.S. price builder mapping requirement.
- Enforced strict SEC filing no-lookahead, verified split/reverse-split share scaling, previous-close pre-open values, date alignment, and positive safe-integer market-cap outputs.

### Changed
- Treats `config/market-source-map.json` as tracked build metadata while keeping provider identities out of player-facing data and runtime payloads.
- App version advanced to `v0.33.1`; save schema remains v13 and production price files and price-ingestion rules are unchanged.

'''
          if marker not in changelog_text or '## [0.33.1] - 2026-08-29' in changelog_text:
              raise SystemExit('CHANGELOG.md: release insertion point invalid')
          changelog.write_text(changelog_text.replace(marker, release + marker, 1))
          PY

          cat > scripts/data/providers/sec-edgar.ts <<'EOF'
          import { join } from 'node:path'
          import { readJsonIfExists, sleep, writeJsonAtomic } from '../io'

          const SEC_DATA_ROOT = 'https://data.sec.gov'
          const SEC_WEB_ROOT = 'https://www.sec.gov'

          export interface SecFetchOptions {
            cacheRoot: string
            force: boolean
            delayMs: number
            userAgent: string
          }

          type ResponseParser = (response: Response) => Promise<unknown>

          async function requestJson(
            url: URL,
            cachePath: string,
            options: SecFetchOptions,
            parseResponse: ResponseParser = async (response) => await response.json() as unknown,
          ): Promise<unknown> {
            if (!options.force) {
              const cached = await readJsonIfExists(cachePath)
              if (cached !== null) return cached
            }
            let lastError: Error | null = null
            for (let attempt = 0; attempt < 5; attempt += 1) {
              if (options.delayMs > 0) await sleep(options.delayMs)
              try {
                const response = await fetch(url, {
                  headers: {
                    Accept: 'application/json, text/plain;q=0.9, */*;q=0.8',
                    'Accept-Encoding': 'gzip, deflate',
                    'User-Agent': options.userAgent,
                  },
                  signal: AbortSignal.timeout(30_000),
                })
                if (response.ok) {
                  const payload = await parseResponse(response)
                  await writeJsonAtomic(cachePath, payload)
                  return payload
                }
                lastError = new Error(`HTTP ${response.status}`)
                if (response.status !== 403 && response.status !== 429 && response.status < 500) break
              } catch (error) {
                lastError = error instanceof Error ? error : new Error(String(error))
              }
              await sleep(500 * (2 ** attempt))
            }
            throw new Error(`SEC request failed for ${url.pathname}: ${lastError?.message ?? 'unknown error'}`)
          }

          export function parseSecTickerText(text: string): Record<string, { ticker: string; cik_str: number }> {
            const entries = text.split(/\r?\n/).flatMap((line) => {
              const [tickerRaw, cikRaw] = line.trim().split('\t')
              const ticker = tickerRaw?.trim()
              const cik = Number(cikRaw)
              if (!ticker || !Number.isSafeInteger(cik) || cik <= 0) return []
              return [{ ticker, cik_str: cik }]
            })
            if (entries.length === 0) throw new Error('SEC ticker.txt contained no usable ticker/CIK mappings')
            return Object.fromEntries(entries.map((entry, index) => [String(index), entry]))
          }

          export function fetchSecCompanyTickers(options: SecFetchOptions): Promise<unknown> {
            return requestJson(
              new URL(`${SEC_WEB_ROOT}/include/ticker.txt`),
              join(options.cacheRoot, 'sec', 'company_tickers.json'),
              options,
              async (response) => parseSecTickerText(await response.text()),
            )
          }

          export function fetchSecCompanyFacts(cik: number, options: SecFetchOptions): Promise<unknown> {
            const padded = String(cik).padStart(10, '0')
            return requestJson(
              new URL(`${SEC_DATA_ROOT}/api/xbrl/companyfacts/CIK${padded}.json`),
              join(options.cacheRoot, 'sec', 'companyfacts', `CIK${padded}.json`),
              options,
            )
          }

          function tickerKey(value: string): string {
            return value.toUpperCase().replace(/[^A-Z0-9]/g, '')
          }

          export function resolveSecCikForTicker(payload: unknown, privateTicker: string): number {
            if (typeof payload !== 'object' || payload === null || Array.isArray(payload)) {
              throw new Error('SEC ticker mapping must be an object')
            }
            const entries = Object.values(payload as Record<string, unknown>).flatMap((raw) => {
              if (typeof raw !== 'object' || raw === null || Array.isArray(raw)) return []
              const item = raw as Record<string, unknown>
              if (typeof item.ticker !== 'string' || typeof item.cik_str !== 'number') return []
              return [{ ticker: item.ticker.toUpperCase(), cik: item.cik_str }]
            })
            const exact = entries.filter((entry) => entry.ticker === privateTicker.toUpperCase())
            if (exact.length === 1) return exact[0].cik
            const normalized = entries.filter((entry) => tickerKey(entry.ticker) === tickerKey(privateTicker))
            if (normalized.length !== 1) throw new Error('SEC ticker mapping did not resolve the private U.S. symbol uniquely')
            return normalized[0].cik
          }
          EOF

          cat > scripts/data/providers/sec-edgar.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest'
          import { parseSecTickerText, resolveSecCikForTicker } from './sec-edgar'

          describe('SEC official ticker mapping parser', () => {
            it('normalizes the official tab-delimited ticker/CIK file into the resolver shape', () => {
              const payload = parseSecTickerText('ZZTESTA\t123456\nZZ-TESTB\t234567\n')
              expect(resolveSecCikForTicker(payload, 'ZZTESTA')).toBe(123456)
              expect(resolveSecCikForTicker(payload, 'ZZ.TESTB')).toBe(234567)
            })

            it('rejects an empty or unusable mapping file', () => {
              expect(() => parseSecTickerText('\ninvalid\n')).toThrow(/no usable ticker\/CIK mappings/)
            })
          })
          EOF

          cat > scripts/data/source-map.test.ts <<'EOF'
          import { mkdtemp, rm, writeFile } from 'node:fs/promises'
          import { tmpdir } from 'node:os'
          import { join } from 'node:path'
          import { describe, expect, it } from 'vitest'
          import { ASSET_CATALOG } from '../../config/assets'
          import { buildAndPersistUsMarketData } from './us-market-builder'
          import {
            getKrxEndpointForDate,
            getKrxSourceEndpoints,
            loadKoreanMarketSourceMap,
            loadMarketCapSourceMap,
            loadMarketSourceMap,
            type KrxAssetSource,
          } from './source-map'

          const source: KrxAssetSource = {
            provider: 'KRX',
            symbol: '000000',
            endpoint: 'ksq_bydd_trd',
            endpointChanges: [{ effectiveFrom: '2018-02-09', endpoint: 'stk_bydd_trd' }],
          }

          async function withSourceMap(assets: Record<string, unknown>, run: (path: string) => Promise<void>): Promise<void> {
            const directory = await mkdtemp(join(tmpdir(), 'stocklab-source-map-'))
            const path = join(directory, 'market-source-map.json')
            try {
              await writeFile(path, JSON.stringify({ schemaVersion: 1, assets }), 'utf8')
              await run(path)
            } finally {
              await rm(directory, { recursive: true, force: true })
            }
          }

          function supportedMarketCapSources(): Record<string, unknown> {
            let koreanIndex = 0
            let usIndex = 0
            return Object.fromEntries(ASSET_CATALOG.flatMap((asset) => {
              if (asset.market === 'KR') {
                koreanIndex += 1
                return [[asset.id, {
                  provider: 'KRX',
                  endpoint: asset.kind === 'etf' ? 'etf_bydd_trd' : 'stk_bydd_trd',
                  endpointChanges: [],
                  symbol: String(koreanIndex).padStart(6, '0'),
                }]]
              }
              if (asset.kind === 'stock') {
                usIndex += 1
                return [[asset.id, { provider: 'NASDAQ', assetClass: 'stocks', symbol: `ZZTEST${usIndex}` }]]
              }
              return []
            }))
          }

          describe('KRX source venue history', () => {
            it('uses the endpoint effective on the requested date', () => {
              expect(getKrxEndpointForDate(source, '2018-02-08')).toBe('ksq_bydd_trd')
              expect(getKrxEndpointForDate(source, '2018-02-09')).toBe('stk_bydd_trd')
            })
            it('reports every required endpoint', () => expect(getKrxSourceEndpoints(source)).toEqual(['ksq_bydd_trd', 'stk_bydd_trd']))
          })

          describe('source-map provider policy', () => {
            it('parses Korean KRX entries independently of U.S. entries', async () => {
              await withSourceMap({
                K001: { provider: 'KRX', endpoint: 'stk_bydd_trd', endpointChanges: [], symbol: '000001' },
                U001: { provider: 'NASDAQ', assetClass: 'stocks', symbol: 'ZZTESTSTOCK' },
              }, async (path) => {
                const korean = await loadKoreanMarketSourceMap(path)
                expect([...korean.keys()]).toEqual(['K001'])
                expect(korean.get('K001')?.symbol).toBe('000001')
              })
            })

            it('rejects malformed Korean short codes', async () => {
              await withSourceMap({ K001: { provider: 'KRX', endpoint: 'stk_bydd_trd', endpointChanges: [], symbol: '1234' } }, async (path) => {
                await expect(loadKoreanMarketSourceMap(path)).rejects.toThrow(/6-digit KRX short code/)
              })
            })

            it('accepts Nasdaq stock/ETF classes', async () => {
              await withSourceMap({
                U001: { provider: 'NASDAQ', assetClass: 'stocks', symbol: 'ZZTESTSTOCK' },
                UE001: { provider: 'NASDAQ', assetClass: 'etf', symbol: 'ZZTESTETF' },
              }, async (path) => {
                const map = await loadMarketSourceMap(path, true)
                expect(map.assets.get('U001')).toEqual({ provider: 'NASDAQ', assetClass: 'stocks', symbol: 'ZZTESTSTOCK' })
                expect(map.assets.get('UE001')).toEqual({ provider: 'NASDAQ', assetClass: 'etf', symbol: 'ZZTESTETF' })
              })
            })

            it('rejects legacy U.S. providers and mismatched Nasdaq classes', async () => {
              await withSourceMap({ U001: { provider: 'STOOQ', symbol: 'ZZTEST.US' } }, async (path) => {
                await expect(loadMarketSourceMap(path, true)).rejects.toThrow(/KRX or NASDAQ/)
              })
              await withSourceMap({ U001: { provider: 'NASDAQ', assetClass: 'etf', symbol: 'ZZTESTSTOCK' } }, async (path) => {
                await expect(loadMarketSourceMap(path, true)).rejects.toThrow(/assetClass=stocks/)
              })
            })

            it('lets the market-cap builder load exactly KR52 plus 45 U.S. stocks while full U.S. price build stays strict at 57', async () => {
              await withSourceMap(supportedMarketCapSources(), async (path) => {
                const map = await loadMarketCapSourceMap(path)
                const koreanCount = ASSET_CATALOG.filter((asset) => asset.market === 'KR' && map.assets.has(asset.id)).length
                const usStockCount = ASSET_CATALOG.filter((asset) => asset.market === 'US' && asset.kind === 'stock' && map.assets.has(asset.id)).length
                const usEtfCount = ASSET_CATALOG.filter((asset) => asset.market === 'US' && asset.kind === 'etf' && map.assets.has(asset.id)).length
                expect(map.assets.size).toBe(97)
                expect(koreanCount).toBe(52)
                expect(usStockCount).toBe(45)
                expect(usEtfCount).toBe(0)

                await expect(buildAndPersistUsMarketData({
                  from: '2018-01-01',
                  to: '2018-01-02',
                  sourceMapPath: path,
                  outputRoot: tmpdir(),
                  cacheRoot: tmpdir(),
                  force: false,
                  requestDelayMs: 0,
                })).rejects.toThrow(/must contain a NASDAQ mapping/)
              })
            })
          })
          EOF

          cat > src/data/ingestion/marketCapShares.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest'
          import { alignSharesToPriceDate, buildDailyMarketCapBar } from './marketCapShares'

          describe('alignSharesToPriceDate', () => {
            const split = [{ effectiveDate: '2020-08-31', numerator: 4, denominator: 1 }]

            it('moves pre-split shares forward to a post-split price date', () => {
              expect(alignSharesToPriceDate(100, '2020-08-28', '2020-08-31', split)).toBe(400)
            })

            it('moves post-split shares backward to a pre-split close used at pre-open', () => {
              expect(alignSharesToPriceDate(400, '2020-08-31', '2020-08-28', split)).toBe(100)
            })
          })

          describe('buildDailyMarketCapBar', () => {
            it('carries the previous market-cap close into preopen when new shares apply today', () => {
              const previousClose = 1_000
              const bar = buildDailyMarketCapBar(
                { date: '2026-08-28', open: 10, close: 11 },
                200,
                previousClose,
              )

              expect(bar).toEqual({
                date: '2026-08-28',
                preopen: previousClose,
                open: 2_000,
                close: 2_200,
              })
            })

            it('stores derived market caps as rounded positive safe integers', () => {
              const bar = buildDailyMarketCapBar(
                { date: '2026-08-28', open: 10.125, close: 11.375 },
                3,
                null,
              )
              expect(bar).toEqual({ date: '2026-08-28', preopen: null, open: 30, close: 34 })
              expect(Number.isSafeInteger(bar.open)).toBe(true)
              expect(Number.isSafeInteger(bar.close)).toBe(true)
            })

            it('rejects derived values outside the safe-integer range', () => {
              expect(() => buildDailyMarketCapBar(
                { date: '2026-08-28', open: Number.MAX_SAFE_INTEGER, close: Number.MAX_SAFE_INTEGER },
                2,
                null,
              )).toThrow(/safe-integer/)
            })
          })
          EOF

          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]

          permissions:
            contents: read

          jobs:
            quality:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v5
                  with:
                    fetch-depth: 2
                - name: Setup Node
                  uses: actions/setup-node@v5
                  with:
                    node-version: 22
                    cache: npm
                - name: Install dependencies
                  run: npm ci --no-audit --no-fund
                - name: Validate release metadata
                  run: |
                    git show HEAD^:package.json > "$RUNNER_TEMP/base-package.json"
                    BASE_VERSION=$(node -p "require(process.env.RUNNER_TEMP + '/base-package.json').version")
                    RELEASE_BASE_VERSION="$BASE_VERSION" npm run release:check
                - name: Lint
                  run: npm run lint
                - name: Typecheck
                  run: npm run typecheck
                - name: Unit tests
                  run: npm test
                - name: Static market data validation
                  run: npm run data:check
                - name: Historical market-cap validation
                  run: npm run data:market-cap:check
                - name: Private identity boundary validation
                  run: npm run data:identity:check
                - name: Strict Korean market data validation
                  run: npm run data:kr:check
                - name: Strict U.S. market data validation
                  run: npm run data:us:check
                - name: Static market index validation
                  run: npm run data:indices:check
                - name: Static FX data validation
                  run: npm run data:fx:check
                - name: Static BOK base-rate validation
                  run: npm run data:rates:check
                - name: Static corporate-event validation
                  run: npm run data:events:check
                - name: Static news validation
                  run: npm run data:news:check
                - name: Historical data coverage report
                  run: npm run data:coverage
                - name: Build
                  run: npm run build
                - name: Install Chromium
                  run: npx playwright install --with-deps chromium
                - name: Responsive interaction tests
                  run: npm run test:e2e
                - name: Upload visual QA screenshots
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: responsive-ui-screenshots
                    path: test-results/**/*.png
                    if-no-files-found: ignore
          EOF

          cat > .env.example <<'EOF'
          # Build-time credentials. Never expose these through Vite/client env variables.
          BOK_ECOS_API_KEY=

          # Optional SEC fair-access User-Agent override. The builder has a repository contact default.
          SEC_USER_AGENT=

          # Optional complete source-map override for full market rebuilds.
          # Market-cap builds default to the tracked supported map in config/market-source-map.json.
          MARKET_SOURCE_MAP_PATH=.private/market-source-map.json

          # Historical KRX KIND + Nasdaq market-data build controls.
          MARKET_DATA_FROM=2018-01-01
          MARKET_DATA_TO=
          KRX_KIND_REQUEST_DELAY_MS=120
          NASDAQ_REQUEST_DELAY_MS=100

          # Point-in-time U.S. stock market-cap build control.
          SEC_REQUEST_DELAY_MS=120
          EOF

          rm -f \
            .github/tmp-market-cap-bootstrap.sh \
            .github/tmp-resolve-krx-openapi-map.ts \
            .github/tmp-resolve-market-map.ts \
            .github/tmp-resolve-us-verified.ts \
            .github/tmp-resolve-us-yahoo.ts \
            .github/tmp-send-market-cap-map.sh \
            .github/workflows/tmp-resolve-tracked-market-source-map.yml \
            .github/workflows/tmp-resolve-us-verified.yml \
            .github/workflows/tmp-resolve-us-yahoo.yml \
            .github/workflows/tmp-build-market-cap-tracked.yml
          rm -rf .private .bootstrap

          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate permanent code changes before provider build
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Preflight SEC official mapping and identity boundary
        run: npm run data:identity:check

      - name: Build supported market-cap history
        run: npm run data:market-cap:build

      - name: Validate generated market-cap history
        run: |
          npm run data:market-cap:check
          npm run data:identity:check
          npm run data:check
          npm run data:kr:check
          npm run data:us:check
          npm run data:coverage

      - name: Verify coverage counts
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const manifest = require('./public/data/manifest.json')
          const supported = manifest.assets.filter((asset) => asset.marketCapPath)
          const kr = supported.filter((asset) => asset.market === 'KR')
          const us = supported.filter((asset) => asset.market === 'US')
          const usEtf = supported.filter((asset) => asset.market === 'US' && asset.kind === 'etf')
          const krFiles = fs.readdirSync('./public/data/market-cap/kr').filter((name) => name.endsWith('.json'))
          const usFiles = fs.readdirSync('./public/data/market-cap/us').filter((name) => name.endsWith('.json'))
          if (supported.length !== 97 || kr.length !== 52 || us.length !== 45 || usEtf.length !== 0) {
            throw new Error(`market-cap manifest coverage mismatch: total=${supported.length} KR=${kr.length} US=${us.length} US_ETF=${usEtf.length}`)
          }
          if (krFiles.length !== 52 || usFiles.length !== 45) {
            throw new Error(`market-cap file count mismatch: KR=${krFiles.length} US=${usFiles.length}`)
          }
          console.log('Verified market-cap coverage: 97 supported assets.')
          NODE

      - name: Commit generated market-cap data and final tracked changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            .env.example \
            .github \
            CHANGELOG.md \
            package-lock.json \
            scripts/data \
            src/data/ingestion \
            public/data/manifest.json \
            public/data/market-cap
          if git diff --cached --quiet; then
            echo 'No final market-cap changes to commit.'
            exit 0
          fi
          git commit -m 'data: publish supported historical market-cap series'
          git push origin HEAD:feature/keyless-market-cap-97
