name: Build supported market-cap history v15

on:
  push:
    branches: [feature/keyless-market-cap-97]

permissions:
  contents: write
  issues: read

jobs:
  build-market-cap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      KRX_KIND_REQUEST_DELAY_MS: '120'
      NASDAQ_REQUEST_DELAY_MS: '100'
      SEC_REQUEST_DELAY_MS: '120'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Patch one-shot private transport and resolver
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/tmp-market-cap-bootstrap.sh')
          text = path.read_text()
          marker = "echo 'Fresh encrypted 97-asset private market map decrypted successfully.'\n\ncat > .private/verify-reconstructed-map.ts <<'TS'"
          replacement = "echo 'Fresh encrypted 97-asset private market map decrypted successfully.'\nnpx tsx .github/tmp-resolve-market-map.ts\n\ncat > .private/verify-reconstructed-map.ts <<'TS'"
          if marker not in text:
              raise SystemExit('private resolver insertion point missing')
          text = text.replace(marker, replacement, 1)
          old_transport = '''prefix="MARKET_CAP_MAP_CMS_V1:${GITHUB_RUN_ID}:"
          endpoint="repos/${GITHUB_REPOSITORY}/issues/82/comments"
          payload=''
          for _ in $(seq 1 360); do
            payload="$(gh api "$endpoint" --paginate --jq "[.[] | select(.body | startswith(\\"${prefix}\\")) | .body] | last // \\"\\"" || true)"
            if [ -n "$payload" ]; then break; fi
            sleep 5
          done
          test -n "$payload" || { echo 'Fresh encrypted market-cap map comment was not supplied.' >&2; exit 1; }
          mkdir -p .private
          printf '%s' "${payload#${prefix}}" | tr -d '\\r\\n ' | base64 -d > "$RUNNER_TEMP/market-cap-private/map.cms"'''
          new_transport = '''prefix="MARKET_CAP_MAP_CMS_V2:${GITHUB_RUN_ID}:"
          endpoint="repos/${GITHUB_REPOSITORY}/issues/82/comments"
          payload=''
          for _ in $(seq 1 360); do
            payload=''
            complete=true
            for index in 1 2 3 4; do
              part_prefix="${prefix}${index}/4:"
              part="$(gh api "$endpoint" --paginate --jq "[.[] | select(.body | startswith(\\"${part_prefix}\\")) | .body] | last // \\"\\"" || true)"
              if [ -z "$part" ]; then complete=false; break; fi
              payload+="${part#${part_prefix}}"
            done
            if [ "$complete" = true ]; then break; fi
            sleep 5
          done
          test -n "$payload" || { echo 'Fresh encrypted market-cap map chunks were not supplied.' >&2; exit 1; }
          mkdir -p .private
          printf '%s' "$payload" | tr -d '\\r\\n ' | base64 -d > "$RUNNER_TEMP/market-cap-private/map.cms"'''
          if old_transport not in text:
              raise SystemExit('private transport insertion point missing')
          text = text.replace(old_transport, new_transport, 1)
          text = text.replace(' && left.volume === right.volume', '')
          old_cleanup = 'git rm -r .bootstrap .github/workflows/tmp-build-keyless-market-cap-97-v3.yml .github/tmp-market-cap-bootstrap.sh'
          new_cleanup = old_cleanup + ' .github/tmp-resolve-market-map.ts'
          if old_cleanup not in text:
              raise SystemExit('temporary cleanup insertion point missing')
          text = text.replace(old_cleanup, new_cleanup, 1)
          path.write_text(text)

          resolver = Path('.github/tmp-resolve-market-map.ts')
          resolver_text = resolver.read_text().replace(' && left.volume === right.volume', '')
          resolver.write_text(resolver_text)
          PY
      - name: Run one-shot market-cap build
        run: bash .github/tmp-market-cap-bootstrap.sh
