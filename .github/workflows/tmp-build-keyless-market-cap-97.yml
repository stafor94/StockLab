name: Build supported market-cap history

on:
  push:
    branches: [feature/keyless-market-cap-97]

permissions:
  contents: write
  issues: read

jobs:
  build-market-cap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      KRX_KIND_REQUEST_DELAY_MS: '120'
      NASDAQ_REQUEST_DELAY_MS: '100'
      SEC_REQUEST_DELAY_MS: '120'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Finalize patch release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for path in Path('e2e').glob('*.ts'):
              text = path.read_text()
              path.write_text(text.replace('v0.33.0', 'v0.33.1'))

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          if '## [0.33.1] - 2026-08-28' not in text:
              entry = "## [0.33.1] - 2026-08-28\n\n### Changed\n- Historical market-cap data is generated for the 52 Korean assets and 45 U.S. stocks with verified authoritative inputs. Korean assets use KRX KIND historical listed shares with the existing unadjusted KRX KIND prices; U.S. stocks use existing unadjusted Nasdaq prices with point-in-time SEC EDGAR shares outstanding.\n- U.S. pre-open market capitalization now carries the previous market-cap close exactly, while newly available SEC shares affect only the current session open/close and filing-day information remains unavailable until the next trading day.\n- The 12 U.S. ETFs intentionally remain without market-cap data because authoritative historical shares-outstanding coverage is not available for this release.\n- Private source identities are transported only as one-run encrypted runner input and are validated against public outputs without publishing ticker, ISIN, or CIK values.\n- App version advanced to `v0.33.1`; save schema remains v13 and trading, settlement, portfolio, corporate-action, price, FX/rate, and market-progression economics are unchanged.\n"
              text = text.replace('## [Unreleased]\n', '## [Unreleased]\n\n' + entry + '\n', 1)
              changelog.write_text(text)
          PY

      - name: Apply market-cap privacy and supported-map fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/data/build-market-cap-data.ts')
          text = path.read_text()
          old = 'loadMarketSourceMap(options.sourceMapPath, false)'
          new = 'loadMarketSourceMap(options.sourceMapPath, true)'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('market-cap source-map mode did not match expected implementation')
          path.write_text(text)

          path = Path('scripts/data/providers/sec-edgar.ts')
          text = path.read_text()
          old = "throw new Error(`SEC request failed for ${url.pathname}: ${lastError?.message ?? 'unknown error'}`)"
          new = "throw new Error(`SEC request failed: ${lastError?.message ?? 'unknown error'}`)"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('SEC error sanitization did not match expected implementation')
          path.write_text(text)

          path = Path('src/data/ingestion/krxKindListedShares.ts')
          text = path.read_text()
          replacements = {
              'throw new Error(`KRX KIND security row ${securityCode} matched more than one private asset identity`)': "throw new Error('KRX KIND security row matched more than one private asset identity')",
              'throw new Error(`KRX KIND returned incomplete listed-share fields for ${symbol}`)': "throw new Error('KRX KIND returned incomplete listed-share fields for a private asset identity')",
              'throw new Error(`KRX KIND returned conflicting security-level rows for ${symbol}`)': "throw new Error('KRX KIND returned conflicting security-level rows for a private asset identity')",
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit('KRX identity error sanitization did not match expected implementation')
          path.write_text(text)
          PY

      - name: Validate code before private data build
        run: |
          RELEASE_BASE_VERSION=0.33.0 npm run release:check
          npm run lint
          npm run typecheck
          npm test

      - name: Create and publish one-run encryption certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/market-cap-private" .bootstrap
          openssl req -x509 -newkey rsa:4096 -nodes -days 1 \
            -subj '/CN=StockLab market-cap one-run bootstrap' \
            -keyout "$RUNNER_TEMP/market-cap-private/key.pem" \
            -out "$RUNNER_TEMP/market-cap-private/cert.pem" >/dev/null 2>&1
          cp "$RUNNER_TEMP/market-cap-private/cert.pem" .bootstrap/market-cap-bootstrap-cert.pem
          printf '%s\n' "$GITHUB_RUN_ID" > .bootstrap/market-cap-bootstrap-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .bootstrap/market-cap-bootstrap-cert.pem .bootstrap/market-cap-bootstrap-run-id.txt
          git commit -m 'ci: publish one-run market-cap bootstrap certificate'
          git push origin HEAD:feature/keyless-market-cap-97
          echo 'Published one-run market-cap encryption certificate.'

      - name: Wait for encrypted private map comment
        shell: bash
        run: |
          set -euo pipefail
          prefix="MARKET_CAP_MAP_CMS_V1:${GITHUB_RUN_ID}:"
          payload=''
          for _ in $(seq 1 180); do
            payload="$(gh api 'repos/${GITHUB_REPOSITORY}/issues/82/comments' --paginate --jq "[.[] | select(.body | startswith(\"${prefix}\")) | .body] | last // \"\"" || true)"
            if [ -n "$payload" ]; then break; fi
            sleep 5
          done
          test -n "$payload" || { echo 'Encrypted market-cap map comment was not supplied.' >&2; exit 1; }
          mkdir -p .private
          printf '%s' "${payload#${prefix}}" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/market-cap-private/map.cms"
          openssl cms -decrypt -binary -inform DER \
            -in "$RUNNER_TEMP/market-cap-private/map.cms" \
            -recip "$RUNNER_TEMP/market-cap-private/cert.pem" \
            -inkey "$RUNNER_TEMP/market-cap-private/key.pem" \
            -out .private/market-source-map.json
          chmod 600 .private/market-source-map.json
          jq -e '
            .schemaVersion == 1
            and (.assets | type == "object")
            and ((.assets | keys | length) == 97)
            and (([.assets | keys[] | select(test("^(K[0-9]{3}|KE[0-9]{3})$"))] | length) == 52)
            and (([.assets | keys[] | select(test("^U[0-9]{3}$"))] | length) == 45)
            and (([.assets | keys[] | select(test("^UE"))] | length) == 0)
            and ([.assets | to_entries[] | select(.key | test("^(K[0-9]{3}|KE[0-9]{3})$")) | select(.value.provider != "KRX")] | length == 0)
            and ([.assets | to_entries[] | select(.key | test("^U[0-9]{3}$")) | select(.value.provider != "NASDAQ" or .value.assetClass != "stocks")] | length == 0)
          ' .private/market-source-map.json >/dev/null
          echo 'Encrypted 97-asset private market map decrypted successfully.'

      - name: Verify reconstructed private mappings against existing official prices
        shell: bash
        run: |
          set -euo pipefail
          cat > .private/verify-reconstructed-map.ts <<'TS'
          import { join } from 'node:path'
          import { ASSET_CATALOG } from '../config/assets'
          import { parseAssetPriceSeries } from '../src/data/schema'
          import { normalizeKrxKindHistoricalResponse, parseKrxKindIssuerInfo } from '../src/data/ingestion/krxKindHistorical'
          import { normalizeNasdaqHistoricalPayload, nasdaqHistoricalTotalRecords } from '../src/data/ingestion/nasdaqHistorical'
          import { classifySplitAdjustment, unadjustSplitPrices, type EffectiveSplit } from '../src/data/ingestion/unadjustSplitPrices'
          import { readJson } from '../scripts/data/io'
          import { fetchKrxKindHistoricalResponse, fetchKrxKindIssuerLookup, openKrxKindSession } from '../scripts/data/providers/krx-kind'
          import { fetchNasdaqHistoricalPayload } from '../scripts/data/providers/nasdaq'
          import { loadMarketSourceMap } from '../scripts/data/source-map'
          import { VERIFIED_US_SPLIT_EVENTS } from '../scripts/data/us-split-events'
          import type { DailyBar } from '../src/types/market'

          const ROOT = process.cwd()
          const CACHE_ROOT = join(ROOT, '.cache', 'market-data')
          const sourceMap = await loadMarketSourceMap(join(ROOT, '.private', 'market-source-map.json'), true)

          function barsEqual(left: DailyBar, right: DailyBar): boolean {
            return left.date === right.date && left.open === right.open && left.high === right.high
              && left.low === right.low && left.close === right.close && left.volume === right.volume
          }

          for (const asset of ASSET_CATALOG.filter((item) => item.market === 'KR')) {
            const source = sourceMap.assets.get(asset.id)
            if (!source || source.provider !== 'KRX') throw new Error(`${asset.id}: missing reconstructed KRX mapping`)
            const existing = parseAssetPriceSeries(await readJson(join(ROOT, 'public', 'data', asset.dataPath)))
            const expected = existing.bars[0]
            try {
              const xml = await fetchKrxKindIssuerLookup(source.symbol, { cacheRoot: CACHE_ROOT, force: true, delayMs: 80 })
              const issuer = parseKrxKindIssuerInfo(xml, source.symbol)
              const session = await openKrxKindSession(issuer.issuerCode, 80)
              const response = await fetchKrxKindHistoricalResponse({
                symbol: source.symbol,
                issuerCode: issuer.issuerCode,
                from: expected.date,
                to: expected.date,
                session,
                cacheRoot: CACHE_ROOT,
                force: true,
                delayMs: 80,
              })
              const actual = normalizeKrxKindHistoricalResponse(response, { from: expected.date, to: expected.date })[0]
              if (!actual || !barsEqual(actual, expected)) throw new Error('price mismatch')
            } catch {
              throw new Error(`${asset.id}: reconstructed private mapping does not reproduce existing KRX KIND price identity`)
            }
            console.log(`Verified reconstructed mapping for ${asset.id}`)
          }

          for (const asset of ASSET_CATALOG.filter((item) => item.market === 'US' && item.kind === 'stock')) {
            const source = sourceMap.assets.get(asset.id)
            if (!source || source.provider !== 'NASDAQ') throw new Error(`${asset.id}: missing reconstructed Nasdaq mapping`)
            const existing = parseAssetPriceSeries(await readJson(join(ROOT, 'public', 'data', asset.dataPath)))
            const from = existing.bars[0].date
            const to = existing.bars.at(-1)!.date
            try {
              const payload = await fetchNasdaqHistoricalPayload({
                symbol: source.symbol,
                assetClass: source.assetClass,
                from,
                to,
                limit: 5000,
                cacheRoot: CACHE_ROOT,
                force: true,
                delayMs: 80,
              })
              const adjusted = normalizeNasdaqHistoricalPayload(payload, { from, to })
              const totalRecords = nasdaqHistoricalTotalRecords(payload)
              if (totalRecords !== null && totalRecords > adjusted.length) throw new Error('unexpected pagination')
              const adjustedSplits: EffectiveSplit[] = []
              for (const event of VERIFIED_US_SPLIT_EVENTS.filter((item) => item.assetId === asset.id && item.effectiveDate >= from && item.effectiveDate <= to)) {
                const split = { effectiveDate: event.effectiveDate, numerator: event.numerator, denominator: event.denominator }
                const state = classifySplitAdjustment(adjusted, split)
                if (state === 'ambiguous') throw new Error('ambiguous split state')
                if (state === 'adjusted') adjustedSplits.push(split)
              }
              const actual = unadjustSplitPrices(adjusted, adjustedSplits)
              if (actual.length !== existing.bars.length || actual.some((bar, index) => !barsEqual(bar, existing.bars[index]))) {
                throw new Error('price mismatch')
              }
            } catch {
              throw new Error(`${asset.id}: reconstructed private mapping does not reproduce existing Nasdaq price identity`)
            }
            console.log(`Verified reconstructed mapping for ${asset.id}`)
          }

          console.log('Verified all 97 reconstructed private mappings against existing official price identities.')
          TS
          npx tsx .private/verify-reconstructed-map.ts
          rm -f .private/verify-reconstructed-map.ts

      - name: Build keyless historical market caps
        run: npm run data:market-cap:build

      - name: Validate generated data and private identity boundary
        run: |
          npm run data:market-cap:check
          npm run data:identity:check
          npm run data:check
          npm run data:kr:check
          npm run data:us:check
          npm run data:coverage
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run responsive Playwright E2E
        run: npm run test:e2e

      - name: Remove private material
        if: always()
        run: rm -rf .private "$RUNNER_TEMP/market-cap-private" .cache

      - name: Commit only public supported market caps and source fixes
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .private/market-source-map.json
          git rm -r .bootstrap .github/workflows/tmp-build-keyless-market-cap-97.yml
          git add CHANGELOG.md e2e scripts/data/build-market-cap-data.ts scripts/data/providers/sec-edgar.ts src/data/ingestion/krxKindListedShares.ts public/data/manifest.json public/data/market-cap
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'data: populate supported historical market caps'
          git push origin HEAD:feature/keyless-market-cap-97
