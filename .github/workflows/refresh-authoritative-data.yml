name: Refresh Bank of Korea reference data

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-bok:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Bank of Korea FX and base rates
        env:
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BOK_ECOS_API_KEY" || {
            echo 'BOK_ECOS_API_KEY secret is required' >&2
            exit 1
          }
          npm run data:fx:build
          npm run data:rates:build

      - name: Validate generated reference datasets
        run: |
          npm run data:fx:check
          npm run data:rates:check
          npm run data:events:check
          npm run data:news:check
          npm run data:check
          npm run data:coverage

      - name: Run code quality gates
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Upload generated BOK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bok-reference-data-${{ github.run_id }}
          path: |
            public/data/fx
            public/data/rates
          retention-days: 7

      - name: Commit generated BOK data to a review branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          branch="data/bok-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add public/data/fx public/data/rates
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'data: refresh Bank of Korea reference data'
          git push origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open BOK data review pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.commit.outputs.branch }}" \
            --title 'data: refresh Bank of Korea reference data' \
            --body 'Generated from Bank of Korea ECOS. Market OHLC is intentionally not generated by this workflow; Korean prices use KRX KIND and U.S. prices use the Stooq production path.'
