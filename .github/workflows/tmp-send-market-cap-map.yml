name: Send fresh one-run market-cap map

on:
  push:
    branches: [feature/keyless-market-cap-97]

permissions:
  contents: read
  issues: write

jobs:
  send-private-map:
    if: github.actor == 'github-actions[bot]' && startsWith(github.event.head_commit.message, 'ci: publish fresh one-run market-cap bootstrap certificate')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      MARKET_SOURCE_MAP_JSON: ${{ secrets.MARKET_SOURCE_MAP_JSON }}
    steps:
      - name: Checkout fresh certificate commit
        uses: actions/checkout@v5
      - name: Encrypt and send supported private map
        shell: bash
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/market-cap-map-sender"
          mkdir -p "$tmp"
          cleanup() {
            rm -rf "$tmp"
            unset MARKET_SOURCE_MAP_JSON || true
          }
          trap cleanup EXIT
          test -n "${MARKET_SOURCE_MAP_JSON:-}" || {
            echo 'Private market source secret is unavailable.' >&2
            exit 1
          }
          run_id="$(tr -d '\r\n ' < .bootstrap/market-cap-bootstrap-run-id.txt)"
          test -n "$run_id" || { echo 'Fresh bootstrap run id is missing.' >&2; exit 1; }
          test -s .bootstrap/market-cap-bootstrap-cert.pem || { echo 'Fresh bootstrap certificate is missing.' >&2; exit 1; }
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          source = json.loads(os.environ['MARKET_SOURCE_MAP_JSON'])
          assets = source.get('assets')
          if not isinstance(assets, dict):
              raise SystemExit('Private market source secret has an invalid structure.')
          ids = [*(f'K{i:03d}' for i in range(1, 41)), *(f'E{i:03d}' for i in range(1, 13)), *(f'U{i:03d}' for i in range(1, 46))]
          if any(asset_id not in assets for asset_id in ids):
              raise SystemExit('Private market source secret is missing a supported asset slot.')
          filtered = {'schemaVersion': 1, 'assets': {asset_id: assets[asset_id] for asset_id in ids}}
          path = Path(os.environ['RUNNER_TEMP']) / 'market-cap-map-sender' / 'map.json'
          path.write_text(json.dumps(filtered, separators=(',', ':')))
          path.chmod(0o600)
          print('Prepared exactly 97 supported private source slots for one-run encryption.')
          PY
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in "$tmp/map.json" \
            -out "$tmp/map.cms" \
            .bootstrap/market-cap-bootstrap-cert.pem
          payload="$(base64 -w0 "$tmp/map.cms")"
          size=${#payload}
          chunk=$(( (size + 3) / 4 ))
          endpoint="repos/${GITHUB_REPOSITORY}/issues/82/comments"
          for index in 1 2 3 4; do
            start=$(( (index - 1) * chunk ))
            part="${payload:start:chunk}"
            test -n "$part" || { echo 'Encrypted payload chunking failed.' >&2; exit 1; }
            gh api --method POST "$endpoint" \
              -f body="MARKET_CAP_MAP_CMS_V2:${run_id}:${index}/4:${part}" >/dev/null
          done
          echo 'Fresh encrypted 97-asset private market map supplied.'
