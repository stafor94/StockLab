name: Validate keyless market cap (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact target HEAD
        uses: actions/checkout@v5
        with:
          ref: a26e35a19202282a0890152d5f26df85081297ae
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Historical market-cap validation
        run: npm run data:market-cap:check
