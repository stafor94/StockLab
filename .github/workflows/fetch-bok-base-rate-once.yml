name: Fetch BOK base rate once

on:
  push:
    branches: [data/complete-bok-base-rate-history]
    paths: [.github/workflows/fetch-bok-base-rate-once.yml]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Diagnose official ECOS access
        shell: bash
        run: |
          set -u
          url='https://ecos.bok.or.kr/api/StatisticSearch/sample/json/kr/1/10/722Y001/D/20171130/20171209/0101000'
          echo '--- DNS ---'
          getent ahostsv4 ecos.bok.or.kr || true
          echo '--- direct HTTPS IPv4 ---'
          curl -4 -L --connect-timeout 10 --max-time 20 -sS -D - "$url" -o /tmp/direct.json || true
          test -f /tmp/direct.json && head -c 1000 /tmp/direct.json || true
          echo
          echo '--- direct HTTP IPv4 ---'
          http_url="${url/https:\/\//http://}"
          curl -4 -L --connect-timeout 10 --max-time 20 -sS -D - "$http_url" -o /tmp/http.json || true
          test -f /tmp/http.json && head -c 1000 /tmp/http.json || true
          echo
          echo '--- Jina raw transport ---'
          proxy_url="https://r.jina.ai/http://ecos.bok.or.kr/api/StatisticSearch/sample/json/kr/1/10/722Y001/D/20171130/20171209/0101000"
          curl -L --connect-timeout 10 --max-time 30 -sS -D - "$proxy_url" -o /tmp/proxy.txt || true
          test -f /tmp/proxy.txt && head -c 3000 /tmp/proxy.txt || true
          echo
