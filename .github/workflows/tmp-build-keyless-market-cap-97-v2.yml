name: Build supported market-cap history v2

on:
  push:
    branches: [feature/keyless-market-cap-97]

permissions:
  contents: write
  issues: read

jobs:
  build-market-cap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      KRX_KIND_REQUEST_DELAY_MS: '120'
      NASDAQ_REQUEST_DELAY_MS: '100'
      SEC_REQUEST_DELAY_MS: '120'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Finalize release metadata and source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for path in Path('e2e').glob('*.ts'):
              text = path.read_text()
              path.write_text(text.replace('v0.33.0', 'v0.33.1'))

          lock = Path('package-lock.json')
          text = lock.read_text()
          old = '"version": "0.18.0"'
          if text.count(old) >= 2:
              text = text.replace(old, '"version": "0.33.1"', 2)
          lock.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          if '## [0.33.1] - 2026-08-28' not in text:
              entry = "## [0.33.1] - 2026-08-28\n\n### Changed\n- Historical market-cap data is generated for the 52 Korean assets and 45 U.S. stocks with verified authoritative inputs. Korean assets use KRX KIND historical listed shares with the existing unadjusted KRX KIND prices; U.S. stocks use existing unadjusted Nasdaq prices with point-in-time SEC EDGAR shares outstanding.\n- U.S. pre-open market capitalization now carries the previous market-cap close exactly, while newly available SEC shares affect only the current session open/close and filing-day information remains unavailable until the next trading day.\n- The 12 U.S. ETFs intentionally remain without market-cap data because authoritative historical shares-outstanding coverage is not available for this release.\n- Private source identities are transported only as one-run encrypted runner input and are validated against public outputs without publishing ticker, ISIN, CIK, or symbol values.\n- App version advanced to `v0.33.1`; save schema remains v13 and trading, settlement, portfolio, corporate-action, price, FX/rate, and market-progression economics are unchanged.\n"
              text = text.replace('## [Unreleased]\n', '## [Unreleased]\n\n' + entry + '\n', 1)
              changelog.write_text(text)

          path = Path('scripts/data/build-market-cap-data.ts')
          text = path.read_text()
          text = text.replace('loadMarketSourceMap(options.sourceMapPath, false)', 'loadMarketSourceMap(options.sourceMapPath, true)', 1)
          marker = "const DEFAULT_SEC_USER_AGENT = 'StockLab market-cap builder (+https://github.com/stafor94/StockLab)'\n"
          proof_const = marker + "const US_SEC_PROOF_PATH = join(ROOT, 'config', 'market-cap-us-sec-proof.json')\n"
          if 'US_SEC_PROOF_PATH' not in text:
              if marker not in text: raise SystemExit('market-cap proof constant insertion point missing')
              text = text.replace(marker, proof_const, 1)
          old_sig = "  sources: Map<string, NasdaqAssetSource>,\n  options: BuildOptions,\n  generatedAt: string,\n): Promise<Map<string, AssetMarketCapitalizationSeries>> {"
          new_sig = "  sources: Map<string, NasdaqAssetSource>,\n  proofs: Map<string, SecSharesOutstandingSnapshot[]>,\n  options: BuildOptions,\n  generatedAt: string,\n): Promise<Map<string, AssetMarketCapitalizationSeries>> {"
          if old_sig in text:
              text = text.replace(old_sig, new_sig, 1)
          elif new_sig not in text:
              raise SystemExit('US builder proof parameter insertion point missing')
          old_snap = "    const snapshots = normalizeSecSharesOutstandingCompanyFacts(facts)\n    if (snapshots.length === 0) throw new Error(`${asset.id}: SEC EDGAR has no usable shares-outstanding facts`)"
          new_snap = old_snap + "\n    proofs.set(asset.id, snapshots)"
          if old_snap in text and 'proofs.set(asset.id, snapshots)' not in text:
              text = text.replace(old_snap, new_snap, 1)
          old_call = "  const stocks = await buildUsStocks(usStocks, prices, usSources, options, generatedAt)"
          new_call = "  const usSecProofs = new Map<string, SecSharesOutstandingSnapshot[]>()\n  const stocks = await buildUsStocks(usStocks, prices, usSources, usSecProofs, options, generatedAt)"
          if old_call in text:
              text = text.replace(old_call, new_call, 1)
          elif new_call not in text:
              raise SystemExit('US builder proof call insertion point missing')
          proof_marker = "  const supportedIds = new Set(supportedAssets.map((asset) => asset.id))\n"
          proof_write = "  await writeJsonAtomic(US_SEC_PROOF_PATH, {\n    schemaVersion: 1,\n    assets: usStocks.map((asset) => ({ id: asset.id, snapshots: usSecProofs.get(asset.id) ?? [] })),\n  })\n\n" + proof_marker
          if 'assets: usStocks.map((asset) => ({ id: asset.id, snapshots:' not in text:
              if proof_marker not in text: raise SystemExit('US proof write insertion point missing')
              text = text.replace(proof_marker, proof_write, 1)
          path.write_text(text)

          path = Path('scripts/data/providers/sec-edgar.ts')
          text = path.read_text()
          text = text.replace("throw new Error(`SEC request failed for ${url.pathname}: ${lastError?.message ?? 'unknown error'}`)", "throw new Error(`SEC request failed: ${lastError?.message ?? 'unknown error'}`)", 1)
          path.write_text(text)

          path = Path('src/data/ingestion/krxKindListedShares.ts')
          text = path.read_text()
          replacements = {
              'throw new Error(`KRX KIND security row ${securityCode} matched more than one private asset identity`)': "throw new Error('KRX KIND security row matched more than one private asset identity')",
              'throw new Error(`KRX KIND returned incomplete listed-share fields for ${symbol}`)': "throw new Error('KRX KIND returned incomplete listed-share fields for a private asset identity')",
              'throw new Error(`KRX KIND returned conflicting security-level rows for ${symbol}`)': "throw new Error('KRX KIND returned conflicting security-level rows for a private asset identity')",
          }
          for old, new in replacements.items():
              text = text.replace(old, new, 1)
          path.write_text(text)

          Path('src/data/ingestion/krxKindListedShares.test.ts').write_text(r'''import { describe, expect, it } from 'vitest'
import { parseKrxKindListedSharesHtml } from './krxKindListedShares'

