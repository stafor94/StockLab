name: Audit private identity leaks (temporary)

on:
  push:
    branches: [validation/keyless-market-cap-97-final]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/keyless-market-cap-97
      - name: List all private identity matches
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          root = Path('.')
          source_map_path = Path('config/market-source-map.json')
          source_map = json.loads(source_map_path.read_text(encoding='utf-8'))
          excluded = {'.git', '.private', '.cache', 'node_modules', 'dist', 'playwright-report', 'test-results'}
          exts = {'.json', '.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs', '.md', '.yml', '.yaml', '.html', '.css'}
          banned_keys = {'ticker', 'symbol', 'isin', 'cik', 'seccik'}

          tokens = []
          sensitive_values = set()
          for asset_id, source in source_map['assets'].items():
              symbol = source['symbol']
              sensitive_values.add(symbol)
              if source['provider'] == 'NASDAQ' and symbol.isalpha() and len(symbol) >= 3:
                  tokens.append((asset_id, symbol))
              isin = source.get('isin')
              if source['provider'] == 'KRX' and isin:
                  sensitive_values.add(isin)
                  tokens.append((asset_id, isin))
              cik = source.get('secCik')
              if source['provider'] == 'NASDAQ' and cik is not None:
                  padded = str(cik).zfill(10)
                  sensitive_values.add(padded)
                  sensitive_values.add(padded.lstrip('0'))

          findings = []

          def public_json_find(value, rel, path='$'):
              if isinstance(value, str):
                  if value in sensitive_values:
                      findings.append((rel, 'public-json-sensitive-value', path))
                  return
              if isinstance(value, list):
                  for i, item in enumerate(value):
                      public_json_find(item, rel, f'{path}[{i}]')
                  return
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key.lower() in banned_keys:
                          findings.append((rel, 'public-json-forbidden-field', f'{path}.{key}'))
                      public_json_find(child, rel, f'{path}.{key}')

          for path in root.rglob('*'):
              if not path.is_file() or path.suffix not in exts:
                  continue
              parts = set(path.parts)
              if parts & excluded:
                  continue
              rel = path.as_posix()
              if rel == source_map_path.as_posix():
                  continue
              text = path.read_text(encoding='utf-8')
              if rel.startswith('public/data/') and rel.endswith('.json'):
                  public_json_find(json.loads(text), rel)
                  continue
              for asset_id, token in tokens:
                  if re.search(r'(^|[^A-Za-z0-9])' + re.escape(token) + r'([^A-Za-z0-9]|$)', text):
                      findings.append((rel, asset_id, 'tracked-text'))

          for item in sorted(set(findings)):
              print('IDENTITY_FINDING|' + '|'.join(item))
          print(f'IDENTITY_FINDING_COUNT={len(set(findings))}')
          PY
