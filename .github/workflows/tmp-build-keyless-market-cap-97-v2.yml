          PY

      - name: Install strict market-cap validator
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/data/validate-market-cap-data.ts <<'TS'
          import { readdir } from 'node:fs/promises'
          import { join } from 'node:path'
          import { fileURLToPath } from 'node:url'
          import { ASSET_CATALOG, type CatalogAsset } from '../../config/assets'
          import { alignSharesToPriceDate } from '../../src/data/ingestion/marketCapShares'
          import { selectSecSharesAvailableBefore, type SecSharesOutstandingSnapshot } from '../../src/data/ingestion/secSharesOutstanding'
          import { parseAssetMarketCapitalizationSeries, parseAssetPriceSeries, parseMarketDataManifest } from '../../src/data/schema'
          import type { DailyMarketCapitalizationBar } from '../../src/types/market'
          import { readJson } from './io'
          import { VERIFIED_US_SPLIT_EVENTS } from './us-split-events'

          const ROOT = fileURLToPath(new URL('../..', import.meta.url))
          const DATA_ROOT = join(ROOT, 'public', 'data')
          const US_SEC_PROOF_PATH = join(ROOT, 'config', 'market-cap-us-sec-proof.json')
          const BANNED_IDENTITY_KEYS = new Set(['ticker', 'symbol', 'isin', 'cik'])

          function expectedPath(market: 'KR' | 'US', assetId: string): string {
            return `market-cap/${market.toLowerCase()}/${assetId}.json`
          }

          function supportsMarketCap(asset: CatalogAsset): boolean {
            return asset.market === 'KR' || (asset.market === 'US' && asset.kind === 'stock')
          }

          function record(value: unknown, label: string): Record<string, unknown> {
            if (typeof value !== 'object' || value === null || Array.isArray(value)) throw new Error(`${label} must be an object`)
            return value as Record<string, unknown>
          }

          function assertNoIdentityFields(value: unknown, label: string): void {
            if (Array.isArray(value)) {
              for (const item of value) assertNoIdentityFields(item, label)
              return
            }
            if (typeof value !== 'object' || value === null) return
            for (const [key, child] of Object.entries(value)) {
              if (BANNED_IDENTITY_KEYS.has(key.toLowerCase())) throw new Error(`${label}: forbidden private-identity field`)
              assertNoIdentityFields(child, label)
            }
          }

          function positiveIntegerOrNull(value: number | null, label: string): number | null {
            if (value === null) return null
            if (!Number.isSafeInteger(value) || value <= 0) throw new Error(`${label} must be null or a positive safe integer`)
            return value
          }

          function expectedMarketCap(price: number, shares: number, label: string): number {
            const value = Math.round(price * shares)
            if (!Number.isSafeInteger(value) || value <= 0) throw new Error(`${label}: reconstructed market-cap value is invalid`)
            return value
          }

          function validateBars(
            assetId: string,
            market: 'KR' | 'US',
            capBars: DailyMarketCapitalizationBar[],
            priceBars: Array<{ date: string; open: number; close: number }>,
          ): void {
            if (capBars.length !== priceBars.length) throw new Error(`${assetId}: market-cap bars must align one-to-one with price bars`)
            let positiveCloseCount = 0
            let seenPositive = false
            for (let index = 0; index < capBars.length; index += 1) {
              const cap = capBars[index]
              const price = priceBars[index]
              if (cap.date !== price.date) throw new Error(`${assetId}: market-cap date does not align with price date at index ${index}`)
              const preopen = positiveIntegerOrNull(cap.preopen, `${assetId} preopen`)
              const open = positiveIntegerOrNull(cap.open, `${assetId} open`)
              const close = positiveIntegerOrNull(cap.close, `${assetId} close`)
              if (index === 0 && preopen !== null) throw new Error(`${assetId}: first market-cap preopen value must be null`)
              if (index > 0 && preopen !== capBars[index - 1].close) throw new Error(`${assetId}: market-cap preopen must equal previous close`)
              if (market === 'KR' && (open === null || close === null)) throw new Error(`${assetId}: KRX market-cap values must be complete`)
              if ((open === null) !== (close === null)) throw new Error(`${assetId}: open and close market-cap availability must match`)
              if (open !== null && close !== null) {
                seenPositive = true
                positiveCloseCount += 1
                const openShares = open / price.open
                const closeShares = close / price.close
                if (Math.abs(openShares - closeShares) > Math.max(1, Math.abs(closeShares)) * 1e-7) {
                  throw new Error(`${assetId}: open and close market caps imply inconsistent shares outstanding`)
                }
              } else if (seenPositive) {
                throw new Error(`${assetId}: market-cap coverage cannot become unavailable after it starts`)
              }
            }
            if (positiveCloseCount === 0) throw new Error(`${assetId}: market-cap series has no usable values`)
          }

          function parseSecProof(value: unknown): Map<string, SecSharesOutstandingSnapshot[]> {
            assertNoIdentityFields(value, 'U.S. SEC validation proof')
            const root = record(value, 'U.S. SEC validation proof')
            if (root.schemaVersion !== 1 || !Array.isArray(root.assets)) throw new Error('U.S. SEC validation proof has invalid schema')
            const result = new Map<string, SecSharesOutstandingSnapshot[]>()
            for (const rawAsset of root.assets) {
              const asset = record(rawAsset, 'U.S. SEC validation proof asset')
              if (typeof asset.id !== 'string' || !Array.isArray(asset.snapshots)) throw new Error('U.S. SEC validation proof asset is invalid')
              const snapshots = asset.snapshots.map((raw, index) => {
                const item = record(raw, `${asset.id} SEC proof snapshot ${index}`)
                if (
                  typeof item.asOfDate !== 'string' || typeof item.availableFrom !== 'string' || typeof item.form !== 'string'
                  || typeof item.sharesOutstanding !== 'number' || !Number.isSafeInteger(item.sharesOutstanding) || item.sharesOutstanding <= 0
                ) throw new Error(`${asset.id}: invalid SEC proof snapshot`)
                return {
                  asOfDate: item.asOfDate,
                  availableFrom: item.availableFrom,
                  sharesOutstanding: item.sharesOutstanding,
                  form: item.form,
                }
              })
              if (result.has(asset.id)) throw new Error(`${asset.id}: duplicate SEC validation proof`)
              result.set(asset.id, snapshots)
            }
            return result
          }

          function validateUsProof(
            assetId: string,
            capBars: DailyMarketCapitalizationBar[],
            priceBars: Array<{ date: string; open: number; close: number }>,
            snapshots: readonly SecSharesOutstandingSnapshot[],
          ): void {
            const splits = VERIFIED_US_SPLIT_EVENTS.filter((event) => event.assetId === assetId)
            for (let index = 0; index < priceBars.length; index += 1) {
              const price = priceBars[index]
              const cap = capBars[index]
              const selected = selectSecSharesAvailableBefore(snapshots, price.date)
              if (!selected) {
                if (cap.open !== null || cap.close !== null) throw new Error(`${assetId}: market-cap exists before a SEC filing is usable`)
                continue
              }
              if (selected.availableFrom >= price.date) throw new Error(`${assetId}: SEC filing-day no-lookahead violation`)
              const shares = alignSharesToPriceDate(selected.sharesOutstanding, selected.asOfDate, price.date, splits)
              if (cap.open !== expectedMarketCap(price.open, shares, `${assetId} open`)) throw new Error(`${assetId}: open market-cap does not match point-in-time SEC shares`)
              if (cap.close !== expectedMarketCap(price.close, shares, `${assetId} close`)) throw new Error(`${assetId}: close market-cap does not match point-in-time SEC shares`)
            }

            for (const snapshot of snapshots) {
              const filingBar = priceBars.find((bar) => bar.date === snapshot.availableFrom)
              if (!filingBar) continue
              if (selectSecSharesAvailableBefore(snapshots, filingBar.date) === snapshot) throw new Error(`${assetId}: filing-day shares became visible too early`)
            }

            for (const event of splits) {
              let before: { date: string } | undefined
              for (const bar of priceBars) {
                if (bar.date < event.effectiveDate) before = bar
                else break
              }
              const after = priceBars.find((bar) => bar.date >= event.effectiveDate)
              const snapshot = snapshots[0]
              if (!before || !after || !snapshot) continue
              const beforeShares = alignSharesToPriceDate(snapshot.sharesOutstanding, snapshot.asOfDate, before.date, splits)
              const afterShares = alignSharesToPriceDate(snapshot.sharesOutstanding, snapshot.asOfDate, after.date, splits)
              const expectedFactor = splits
                .filter((split) => split.effectiveDate > before!.date && split.effectiveDate <= after.date)
                .reduce((factor, split) => factor * split.numerator / split.denominator, 1)
              const actualFactor = afterShares / beforeShares
              if (Math.abs(actualFactor - expectedFactor) > Math.max(1, Math.abs(expectedFactor)) * 1e-9) {
                throw new Error(`${assetId}: verified split share scaling mismatch`)
              }
            }
          }

          async function assertSeriesFileSet(market: 'kr' | 'us', expectedIds: readonly string[]): Promise<void> {
            const actual = (await readdir(join(DATA_ROOT, 'market-cap', market))).filter((name) => name.endsWith('.json')).sort()
            const expected = expectedIds.map((id) => `${id}.json`).sort()
            if (actual.length !== expected.length || actual.some((name, index) => name !== expected[index])) {
              throw new Error(`${market.toUpperCase()}: market-cap file set does not match supported assets`)
            }
          }

          async function main(): Promise<void> {
            const rawManifest = await readJson(join(DATA_ROOT, 'manifest.json'))
            assertNoIdentityFields(rawManifest, 'market manifest')
            const manifest = parseMarketDataManifest(rawManifest)
            const supportedAssets = ASSET_CATALOG.filter(supportsMarketCap)
            const krAssets = supportedAssets.filter((asset) => asset.market === 'KR')
            const usStocks = supportedAssets.filter((asset) => asset.market === 'US')
            const usEtfs = ASSET_CATALOG.filter((asset) => asset.market === 'US' && asset.kind === 'etf')
            if (supportedAssets.length !== 97 || krAssets.length !== 52 || usStocks.length !== 45 || usEtfs.length !== 12) {
              throw new Error('Catalog market-cap support counts must be KR 52 / US stock 45 / US ETF 12 unsupported')
            }
            const supportedIds = new Set(supportedAssets.map((asset) => asset.id))
            const withMarketCap = manifest.assets.filter((asset) => asset.marketCapPath)
            if (manifest.assets.length !== ASSET_CATALOG.length || withMarketCap.length !== 97) {
              throw new Error('Historical market-cap data must publish exactly 97 supported assets')
            }
            if (usEtfs.some((asset) => manifest.assets.find((item) => item.id === asset.id)?.marketCapPath)) {
              throw new Error('U.S. ETFs must not publish marketCapPath')
            }
            await assertSeriesFileSet('kr', krAssets.map((asset) => asset.id))
            await assertSeriesFileSet('us', usStocks.map((asset) => asset.id))

            const proof = parseSecProof(await readJson(US_SEC_PROOF_PATH))
            if (proof.size !== 45 || usStocks.some((asset) => !proof.has(asset.id))) throw new Error('U.S. SEC validation proof must cover exactly 45 stocks')

            const paths = new Set<string>()
            let totalBars = 0
            for (const asset of manifest.assets) {
              if (!supportedIds.has(asset.id)) {
                if (asset.marketCapPath) throw new Error(`${asset.id}: unsupported U.S. ETF must not publish marketCapPath`)
                continue
              }
              const path = asset.marketCapPath
              if (!path) throw new Error(`${asset.id}: marketCapPath is missing`)
              if (path !== expectedPath(asset.market, asset.id)) throw new Error(`${asset.id}: unexpected marketCapPath`)
              if (paths.has(path)) throw new Error(`${asset.id}: duplicate marketCapPath`)
              paths.add(path)

              const rawCap = await readJson(join(DATA_ROOT, path))
              assertNoIdentityFields(rawCap, `${asset.id} market-cap JSON`)
              const capSeries = parseAssetMarketCapitalizationSeries(rawCap)
              const priceSeries = parseAssetPriceSeries(await readJson(join(DATA_ROOT, asset.dataPath)))
              if (capSeries.id !== asset.id || capSeries.market !== asset.market || capSeries.currency !== asset.currency) {
                throw new Error(`${asset.id}: market-cap metadata does not match manifest metadata`)
              }
              const provider = capSeries.source.authoritativeProvider
              if (asset.market === 'KR' && provider !== 'KRX KIND') throw new Error(`${asset.id}: Korean market-cap source must be KRX KIND`)
              if (asset.market === 'US' && provider !== 'Nasdaq Historical Quotes + SEC EDGAR') throw new Error(`${asset.id}: U.S. stock market-cap source must be Nasdaq prices + SEC EDGAR shares`)
              validateBars(asset.id, asset.market, capSeries.bars, priceSeries.bars)
              if (asset.market === 'US') validateUsProof(asset.id, capSeries.bars, priceSeries.bars, proof.get(asset.id) ?? [])
              totalBars += capSeries.bars.length
            }
            console.log(`Validated 97 historical market-cap series (${krAssets.length} KR / ${usStocks.length} US) with ${totalBars} bars; 12 U.S. ETFs remain unsupported.`)
          }

          main().catch((error: unknown) => {
            console.error(error instanceof Error ? error.message : error)
            process.exitCode = 1
          })
          TS

      - name: Validate code before private data build
        run: |
          npm run release:check
          npm run lint
          npm run typecheck
          npm test

      - name: Create and publish fresh one-run encryption certificate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          mkdir -p "$RUNNER_TEMP/market-cap-private" .bootstrap
          openssl req -x509 -newkey rsa:4096 -nodes -days 1 \
            -subj '/CN=StockLab market-cap one-run bootstrap' \
            -keyout "$RUNNER_TEMP/market-cap-private/key.pem" \
            -out "$RUNNER_TEMP/market-cap-private/cert.pem" >/dev/null 2>&1
          cp "$RUNNER_TEMP/market-cap-private/cert.pem" .bootstrap/market-cap-bootstrap-cert.pem
          printf '%s\n' "$GITHUB_RUN_ID" > .bootstrap/market-cap-bootstrap-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .bootstrap/market-cap-bootstrap-cert.pem .bootstrap/market-cap-bootstrap-run-id.txt
          git commit -m 'ci: publish fresh one-run market-cap bootstrap certificate'
          git push origin HEAD:feature/keyless-market-cap-97
          echo 'Published fresh one-run market-cap encryption certificate.'

      - name: Wait for newly encrypted private map comment
        shell: bash
        run: |
          set -euo pipefail
          prefix="MARKET_CAP_MAP_CMS_V1:${GITHUB_RUN_ID}:"
          endpoint="repos/${GITHUB_REPOSITORY}/issues/82/comments"
          payload=''
          for _ in $(seq 1 360); do
            payload="$(gh api "$endpoint" --paginate --jq "[.[] | select(.body | startswith(\"${prefix}\")) | .body] | last // \"\"" || true)"
            if [ -n "$payload" ]; then break; fi
            sleep 5
          done
          test -n "$payload" || { echo 'Fresh encrypted market-cap map comment was not supplied.' >&2; exit 1; }
          mkdir -p .private
          printf '%s' "${payload#${prefix}}" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/market-cap-private/map.cms"
          openssl cms -decrypt -binary -inform DER \
            -in "$RUNNER_TEMP/market-cap-private/map.cms" \
            -recip "$RUNNER_TEMP/market-cap-private/cert.pem" \
            -inkey "$RUNNER_TEMP/market-cap-private/key.pem" \
            -out .private/market-source-map.json
          chmod 600 .private/market-source-map.json
          jq -e '
            .schemaVersion == 1
            and (.assets | type == "object")
            and ((.assets | keys | length) == 97)
            and (([.assets | keys[] | select(test("^(K[0-9]{3}|KE[0-9]{3})$"))] | length) == 52)
            and (([.assets | keys[] | select(test("^U[0-9]{3}$"))] | length) == 45)
            and (([.assets | keys[] | select(test("^UE"))] | length) == 0)
            and ([.assets | to_entries[] | select(.key | test("^(K[0-9]{3}|KE[0-9]{3})$")) | select(.value.provider != "KRX")] | length == 0)
            and ([.assets | to_entries[] | select(.key | test("^U[0-9]{3}$")) | select(.value.provider != "NASDAQ" or .value.assetClass != "stocks")] | length == 0)
          ' .private/market-source-map.json >/dev/null
          echo 'Fresh encrypted 97-asset private market map decrypted successfully.'

      - name: Verify reconstructed private mappings against existing official prices
        shell: bash
        run: |
          set -euo pipefail
          cat > .private/verify-reconstructed-map.ts <<'TS'
          import { join } from 'node:path'
          import { ASSET_CATALOG } from '../config/assets'
          import { parseAssetPriceSeries } from '../src/data/schema'
          import { normalizeKrxKindHistoricalResponse, parseKrxKindIssuerInfo } from '../src/data/ingestion/krxKindHistorical'
          import { normalizeNasdaqHistoricalPayload, nasdaqHistoricalTotalRecords } from '../src/data/ingestion/nasdaqHistorical'
          import { classifySplitAdjustment, unadjustSplitPrices, type EffectiveSplit } from '../src/data/ingestion/unadjustSplitPrices'
          import { readJson } from '../scripts/data/io'
          import { fetchKrxKindHistoricalResponse, fetchKrxKindIssuerLookup, openKrxKindSession } from '../scripts/data/providers/krx-kind'
          import { fetchNasdaqHistoricalPayload } from '../scripts/data/providers/nasdaq'
          import { loadMarketSourceMap } from '../scripts/data/source-map'
          import { VERIFIED_US_SPLIT_EVENTS } from '../scripts/data/us-split-events'
          import type { DailyBar } from '../src/types/market'

          const ROOT = process.cwd()
          const CACHE_ROOT = join(ROOT, '.cache', 'market-data')
          const sourceMap = await loadMarketSourceMap(join(ROOT, '.private', 'market-source-map.json'), true)

          function barsEqual(left: DailyBar, right: DailyBar): boolean {
            return left.date === right.date && left.open === right.open && left.high === right.high
              && left.low === right.low && left.close === right.close && left.volume === right.volume
          }

          for (const asset of ASSET_CATALOG.filter((item) => item.market === 'KR')) {
            const source = sourceMap.assets.get(asset.id)
            if (!source || source.provider !== 'KRX') throw new Error(`${asset.id}: missing reconstructed KRX mapping`)
            const existing = parseAssetPriceSeries(await readJson(join(ROOT, 'public', 'data', asset.dataPath)))
            const samples = [existing.bars[0], existing.bars[Math.floor((existing.bars.length - 1) / 2)]]
            try {
              const xml = await fetchKrxKindIssuerLookup(source.symbol, { cacheRoot: CACHE_ROOT, force: true, delayMs: 80 })
              const issuer = parseKrxKindIssuerInfo(xml, source.symbol)
              const session = await openKrxKindSession(issuer.issuerCode, 80)
              for (const expected of samples) {
                const response = await fetchKrxKindHistoricalResponse({
                  symbol: source.symbol,
                  issuerCode: issuer.issuerCode,
                  from: expected.date,
                  to: expected.date,
                  session,
                  cacheRoot: CACHE_ROOT,
                  force: true,
                  delayMs: 80,
                })
                const actual = normalizeKrxKindHistoricalResponse(response, { from: expected.date, to: expected.date })[0]
                if (!actual || !barsEqual(actual, expected)) throw new Error('price mismatch')
              }
            } catch {
              throw new Error(`${asset.id}: reconstructed private mapping does not reproduce existing KRX KIND price identity`)
            }
            console.log(`Verified reconstructed mapping for ${asset.id}`)
          }

          for (const asset of ASSET_CATALOG.filter((item) => item.market === 'US' && item.kind === 'stock')) {
            const source = sourceMap.assets.get(asset.id)
            if (!source || source.provider !== 'NASDAQ') throw new Error(`${asset.id}: missing reconstructed Nasdaq mapping`)
            const existing = parseAssetPriceSeries(await readJson(join(ROOT, 'public', 'data', asset.dataPath)))
            const from = existing.bars[0].date
            const to = existing.bars.at(-1)!.date
            try {
              const payload = await fetchNasdaqHistoricalPayload({
                symbol: source.symbol,
                assetClass: source.assetClass,
                from,
                to,
                limit: 5000,
                cacheRoot: CACHE_ROOT,
                force: true,
                delayMs: 80,
              })
              const adjusted = normalizeNasdaqHistoricalPayload(payload, { from, to })
              const totalRecords = nasdaqHistoricalTotalRecords(payload)
              if (totalRecords !== null && totalRecords > adjusted.length) throw new Error('unexpected pagination')
              const adjustedSplits: EffectiveSplit[] = []
              for (const event of VERIFIED_US_SPLIT_EVENTS.filter((item) => item.assetId === asset.id && item.effectiveDate >= from && item.effectiveDate <= to)) {
                const split = { effectiveDate: event.effectiveDate, numerator: event.numerator, denominator: event.denominator }
                const state = classifySplitAdjustment(adjusted, split)
                if (state === 'ambiguous') throw new Error('ambiguous split state')
                if (state === 'adjusted') adjustedSplits.push(split)
              }
              const actual = unadjustSplitPrices(adjusted, adjustedSplits)
              if (actual.length !== existing.bars.length || actual.some((bar, index) => !barsEqual(bar, existing.bars[index]))) throw new Error('price mismatch')
            } catch {
              throw new Error(`${asset.id}: reconstructed private mapping does not reproduce existing Nasdaq price identity`)
            }
            console.log(`Verified reconstructed mapping for ${asset.id}`)
          }

          console.log('Verified all 97 reconstructed private mappings against existing official price identities.')
          TS
          npx tsx .private/verify-reconstructed-map.ts
          rm -f .private/verify-reconstructed-map.ts

      - name: Build keyless historical market caps
        run: npm run data:market-cap:build

      - name: Validate generated data and private identity boundary
        run: |
          npm run release:check
          npm run lint
          npm run typecheck
          npm test
          npm run data:market-cap:check
          npm run data:identity:check
          npm run data:check
          npm run data:kr:check
          npm run data:us:check
          npm run data:coverage
          npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run responsive Playwright E2E
        run: npm run test:e2e

      - name: Remove private material
        if: always()
        run: rm -rf .private "$RUNNER_TEMP/market-cap-private" .cache

      - name: Commit only clean public market-cap release
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .private/market-source-map.json
          git rm -r .bootstrap .github/workflows/tmp-build-keyless-market-cap-97-v2.yml
          git add CHANGELOG.md package-lock.json e2e config/market-cap-us-sec-proof.json scripts/data/build-market-cap-data.ts scripts/data/providers/sec-edgar.ts scripts/data/validate-market-cap-data.ts src/data/ingestion/krxKindListedShares.ts src/data/ingestion/krxKindListedShares.test.ts src/data/ingestion/marketCapShares.ts src/data/ingestion/marketCapShares.test.ts public/data/manifest.json public/data/market-cap
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'data: populate validated historical market caps'
          git push origin HEAD:feature/keyless-market-cap-97
