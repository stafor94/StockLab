name: Build supported market-cap history v34

on:
  push:
    branches: [feature/keyless-market-cap-97]

permissions:
  contents: write
  issues: write

jobs:
  build-market-cap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      KRX_OPEN_API_AUTH_KEY: ${{ secrets.KRX_OPEN_API_AUTH_KEY }}
      KRX_KIND_REQUEST_DELAY_MS: '120'
      NASDAQ_REQUEST_DELAY_MS: '100'
      SEC_REQUEST_DELAY_MS: '120'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 8
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Patch one-shot transport and bounded identity resolver
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow_path = '.github/workflows/tmp-build-keyless-market-cap-97-v3.yml'
          step = '      - name: Patch one-shot private transport and resolver'
          previous = None
          lines = []
          start = None
          for commit in subprocess.check_output(['git', 'rev-list', '--first-parent', '-n', '8', 'HEAD'], text=True).splitlines()[1:]:
              try:
                  candidate = subprocess.check_output(['git', 'show', f'{commit}:{workflow_path}'], text=True)
              except subprocess.CalledProcessError:
                  continue
              candidate_lines = candidate.splitlines()
              if step in candidate_lines:
                  previous = candidate
                  lines = candidate_lines
                  start = lines.index(step)
                  break
          if previous is None or start is None:
              raise SystemExit('previous one-shot patch step missing')
          run_index = next((i for i in range(start + 1, len(lines)) if lines[i] == '        run: |'), None)
          if run_index is None:
              raise SystemExit('previous one-shot patch script missing')
          script_lines = []
          for line in lines[run_index + 1:]:
              if line.startswith('      - name:'):
                  break
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif not line:
                  script_lines.append('')
              else:
                  raise SystemExit('unexpected indentation in previous one-shot patch script')
          if not script_lines:
              raise SystemExit('previous one-shot patch script is empty')
          target = Path('/tmp/stocklab-v31-patch.sh')
          target.write_text('\n'.join(script_lines) + '\n')
          PY
          bash /tmp/stocklab-v31-patch.sh

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/tmp-resolve-market-map.ts')
          text = path.read_text()

          group_old = "    const key = `${context.asset.kind}:${context.prices.bars[0].date}`"
          group_new = "    const key = context.asset.kind"
          if text.count(group_old) != 1:
              raise SystemExit('identity grouping optimization insertion point missing')
          text = text.replace(group_old, group_new, 1)

          venue_old = '''  const initial = source.endpoint
            if (initial !== 'stk_bydd_trd' && initial !== 'ksq_bydd_trd') return
            const bars = context.prices.bars
            const finalVenue = await krxVenueOnDate(source.symbol, bars.at(-1)!.date)'''
          venue_new = '''  const bars = context.prices.bars
            let initial: 'stk_bydd_trd' | 'ksq_bydd_trd' | null = null
            for (const bar of bars.slice(0, 8)) {
              try {
                initial = await krxVenueOnDate(source.symbol, bar.date)
              } catch {
                // Try the next actual price date without exposing private identity values.
              }
              if (initial) break
            }
            if (!initial) throw new Error(`${context.asset.id}: official KRX venue resolution unavailable near listing start`)
            source.endpoint = initial
            source.endpointChanges = []
            const finalVenue = await krxVenueOnDate(source.symbol, bars.at(-1)!.date)'''
          if text.count(venue_old) != 1:
              raise SystemExit('KRX initial venue resolution insertion point missing')
          text = text.replace(venue_old, venue_new, 1)

          us_date_old = '''  const firstDate = contexts[0].prices.bars[0].date
            const firstYear = Number(firstDate.slice(0, 4))'''
          us_date_new = '''  const commonDates = contexts[0].prices.bars
              .map((bar) => bar.date)
              .filter((date) => contexts.every((context) => context.prices.bars.some((bar) => bar.date === date)))
            const resolutionDate = commonDates[0]
            if (!resolutionDate) throw new Error('No common Nasdaq trading date for supported identity group')
            const resolutionYear = Number(resolutionDate.slice(0, 4))'''
          if text.count(us_date_old) != 1:
              raise SystemExit('Nasdaq common-date insertion point missing')
          text = text.replace(us_date_old, us_date_new, 1)
          text = text.replace('ipoYear > firstYear', 'ipoYear > resolutionYear', 1)
          text = text.replace('`Nasdaq official universe scan for ${firstDate}: ${candidates.length} candidates`', '`Nasdaq official universe scan for ${resolutionDate}: ${candidates.length} candidates`', 1)

          adjusted_old = '    const adjusted = await fetchNasdaqOneDay(symbol, firstDate)'
          adjusted_new = '    const adjusted = await fetchNasdaqOneDay(symbol, resolutionDate)'
          if text.count(adjusted_old) != 1:
              raise SystemExit('Nasdaq common-date fetch insertion point missing')
          text = text.replace(adjusted_old, adjusted_new, 1)

          raw_match_old = '      const rawMatch = barsPriceEqual(adjusted, context.prices.bars[0])'
          raw_match_new = "      const expected = context.prices.bars.find((bar) => bar.date === resolutionDate)\n      if (!expected) continue\n      const rawMatch = barsPriceEqual(adjusted, expected)"
          if text.count(raw_match_old) != 1:
              raise SystemExit('Nasdaq expected-bar insertion point missing')
          text = text.replace(raw_match_old, raw_match_new, 1)

          restored_old = '        fullyUnadjustedCandidateBar(context.asset.id, adjusted),\n        context.prices.bars[0],'
          restored_new = '        fullyUnadjustedCandidateBar(context.asset.id, adjusted),\n        expected,'
          if text.count(restored_old) != 1:
              raise SystemExit('Nasdaq restored-price insertion point missing')
          text = text.replace(restored_old, restored_new, 1)

          path.write_text(text)
          PY
      - name: Run one-shot market-cap build
        run: bash .github/tmp-market-cap-bootstrap.sh
      - name: Cleanup failed bootstrap publication
        if: always()
        shell: bash
        run: |
          rm -rf .private .cache "${RUNNER_TEMP:-/tmp}/market-cap-private"
          git fetch origin feature/keyless-market-cap-97
          git reset --hard origin/feature/keyless-market-cap-97
          if [ -f .bootstrap/market-cap-bootstrap-run-id.txt ] && [ "$(cat .bootstrap/market-cap-bootstrap-run-id.txt)" = "$GITHUB_RUN_ID" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git rm -r .bootstrap
            git commit -m 'ci: remove temporary market-cap bootstrap certificate'
            git push origin HEAD:feature/keyless-market-cap-97
          fi
