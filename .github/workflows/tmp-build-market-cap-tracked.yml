name: Build tracked market-cap data

on:
  push:
    branches: [feature/keyless-market-cap-97]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-market-cap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MARKET_SOURCE_MAP_PATH: config/market-source-map.json
      KRX_KIND_REQUEST_DELAY_MS: '25'
      SEC_REQUEST_DELAY_MS: '100'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore provider cache
        uses: actions/cache@v4
        with:
          path: .cache/market-data
          key: market-cap-data-${{ runner.os }}-${{ hashFiles('config/market-source-map.json') }}-${{ github.run_id }}
          restore-keys: |
            market-cap-data-${{ runner.os }}-${{ hashFiles('config/market-source-map.json') }}-
          save-always: true

      - name: Validate permanent code changes
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Sanitize historical changelog identities
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const sourceMap = require('./config/market-source-map.json')
          let text = fs.readFileSync('CHANGELOG.md', 'utf8')
          const tokens = Object.values(sourceMap.assets).flatMap((source) => {
            const values = []
            if (source.provider === 'NASDAQ' && typeof source.symbol === 'string' && source.symbol.length >= 3) values.push(source.symbol)
            if (source.provider === 'KRX' && typeof source.isin === 'string') values.push(source.isin)
            return values
          })
          for (const token of tokens) {
            const escaped = token.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
            const pattern = new RegExp(`(^|[^A-Za-z0-9])${escaped}([^A-Za-z0-9]|$)`, 'g')
            text = text.replace(pattern, '$1masked asset$2')
          }
          fs.writeFileSync('CHANGELOG.md', text)
          NODE

      - name: Preflight SEC official data and identity boundary
        run: |
          node - <<'NODE'
          const sourceMap = require('./config/market-source-map.json')
          const source = Object.values(sourceMap.assets).find((item) => item.provider === 'NASDAQ' && item.assetClass === 'stocks' && Number.isSafeInteger(item.secCik))
          if (!source) throw new Error('tracked SEC provider identifier is missing')
          const cik = String(source.secCik).padStart(10, '0')
          const response = await fetch(`https://data.sec.gov/api/xbrl/companyfacts/CIK${cik}.json`, {
            headers: {
              Accept: 'application/json',
              'Accept-Encoding': 'gzip, deflate',
              'User-Agent': 'StockLab market-cap builder (+https://github.com/stafor94/StockLab)',
            },
          })
          if (!response.ok) throw new Error(`SEC company-facts preflight failed: HTTP ${response.status}`)
          const payload = await response.json()
          if (!payload || typeof payload !== 'object' || !payload.facts) throw new Error('SEC company-facts preflight returned an invalid payload')
          console.log('SEC company-facts preflight passed.')
          NODE
          npm run data:identity:check

      - name: Build supported market-cap history
        run: npm run data:market-cap:build

      - name: Validate generated market-cap history
        run: |
          npm run data:market-cap:check
          npm run data:identity:check
          npm run data:check
          npm run data:kr:check
          npm run data:us:check
          npm run data:coverage

      - name: Verify coverage counts
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const manifest = require('./public/data/manifest.json')
          const supported = manifest.assets.filter((asset) => asset.marketCapPath)
          const kr = supported.filter((asset) => asset.market === 'KR')
          const us = supported.filter((asset) => asset.market === 'US')
          const usEtf = supported.filter((asset) => asset.market === 'US' && asset.kind === 'etf')
          const krFiles = fs.readdirSync('./public/data/market-cap/kr').filter((name) => name.endsWith('.json'))
          const usFiles = fs.readdirSync('./public/data/market-cap/us').filter((name) => name.endsWith('.json'))
          if (supported.length !== 97 || kr.length !== 52 || us.length !== 45 || usEtf.length !== 0) {
            throw new Error(`market-cap manifest coverage mismatch: total=${supported.length} KR=${kr.length} US=${us.length} US_ETF=${usEtf.length}`)
          }
          if (krFiles.length !== 52 || usFiles.length !== 45) {
            throw new Error(`market-cap file count mismatch: KR=${krFiles.length} US=${usFiles.length}`)
          }
          console.log('Verified market-cap coverage: 97 supported assets.')
          NODE

      - name: Finalize release metadata and cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          marker = '## [0.33.0] - 2026-08-28'
          release = ('## [0.33.1] - 2026-08-29\n\n'
                     '### Fixed\n'
                     '- Completed tracked historical market-cap coverage for 52 Korean assets and 45 supported U.S. stocks while keeping 12 U.S. ETFs intentionally unavailable.\n'
                     '- Made the market-cap builder accept the supported 97-entry tracked source map without relaxing the full 57-asset U.S. price builder mapping requirement.\n'
                     '- Enforced strict SEC filing no-lookahead, verified split/reverse-split share scaling, previous-close pre-open values, date alignment, and positive safe-integer market-cap outputs.\n\n'
                     '### Changed\n'
                     '- Treats `config/market-source-map.json` as tracked build metadata while keeping provider identities out of player-facing data and runtime payloads.\n'
                     '- App version advanced to `v0.33.1`; save schema remains v13 and production price files and price-ingestion rules are unchanged.\n\n')
          if marker not in text or '## [0.33.1] - 2026-08-29' in text:
              raise SystemExit('CHANGELOG release insertion point invalid')
          path.write_text(text.replace(marker, release + marker, 1))
          PY
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm run release:check
          npm run data:identity:check
          rm -f .github/workflows/tmp-build-market-cap-tracked.yml
          rm -rf .private .bootstrap .cache

      - name: Commit generated market-cap data and final tracked changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- CHANGELOG.md package-lock.json .github/workflows/tmp-build-market-cap-tracked.yml public/data/manifest.json public/data/market-cap
          if git diff --cached --quiet; then
            echo 'No final market-cap changes to commit.'
            exit 0
          fi
          git commit -m 'data: publish supported historical market-cap series'
          git push origin HEAD:feature/keyless-market-cap-97
