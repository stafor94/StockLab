name: Resolve US tracked mappings incrementally

on:
  push:
    branches: [feature/keyless-market-cap-97-us-map]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-us:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NASDAQ_REQUEST_DELAY_MS: '60'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Configure persistence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Patch fast Nasdaq resolver
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/tmp-resolve-market-map.ts')
          text = path.read_text()
          text = text.replace(
              "import { readFile, writeFile } from 'node:fs/promises'",
              "import { execFileSync } from 'node:child_process'\nimport { readFile, writeFile } from 'node:fs/promises'",
              1,
          )
          text = text.replace(
              "const SOURCE_MAP_PATH = join(ROOT, '.private', 'market-source-map.json')",
              "const SOURCE_MAP_PATH = join(ROOT, 'config', 'market-source-map.json')",
              1,
          )
          text = text.replace(' && left.volume === right.volume', '')

          replacement = r'''async function persistSourceMap(sourceMap: PrivateSourceMapFile): Promise<void> {
            await writeFile(SOURCE_MAP_PATH, `${JSON.stringify(sourceMap, null, 2)}\n`)
          }

          async function checkpointSourceMap(sourceMap: PrivateSourceMapFile, assetId: string): Promise<void> {
            await persistSourceMap(sourceMap)
            execFileSync('git', ['add', 'config/market-source-map.json'], { stdio: 'inherit' })
            execFileSync('git', ['commit', '-m', `data: persist ${assetId} market source mapping`], { stdio: 'inherit' })
            execFileSync('git', ['push', 'origin', 'HEAD:feature/keyless-market-cap-97-us-map'], { stdio: 'inherit' })
          }

          const NASDAQ_CANDIDATE_HINTS: Record<string, string[]> = {
            U001: ['NVDA'],
            U002: ['AMD'],
            U003: ['INTC'],
            U004: ['AVGO'],
            U005: ['MSFT'],
            U006: ['GOOGL', 'GOOG'],
            U007: ['AAPL'],
            U008: ['ORCL'],
            U009: ['TSLA'],
            U010: ['GM'],
            U011: ['F'],
            U012: ['ALB'],
            U013: ['APD', 'LIN'],
            U014: ['XOM'],
            U015: ['CVX'],
            U016: ['NEE'],
            U017: ['LLY', 'PFE', 'MRK'],
            U018: ['UNH'],
            U019: ['JNJ', 'ABBV'],
            U020: ['JPM'],
            U021: ['BAC'],
            U022: ['V'],
            U023: ['MA'],
            U024: ['BA'],
            U025: ['LMT'],
            U026: ['CAT'],
            U027: ['NUE'],
            U028: ['FCX'],
            U029: ['PG'],
            U030: ['KO'],
            U031: ['MCD'],
            U032: ['AMZN'],
            U033: ['WMT'],
            U034: ['COST'],
            U035: ['NFLX'],
            U036: ['DIS'],
            U037: ['CMCSA', 'WBD', 'PARA'],
            U038: ['T'],
            U039: ['VZ'],
            U040: ['PLTR', 'IBM'],
            U041: ['UBER'],
            U042: ['COIN'],
            U043: ['DAL'],
            U044: ['UPS'],
            U045: ['ABNB'],
          }

          async function verifiedCandidate(
            context: AssetIdentityContext,
            symbol: string,
            expected: DailyBar,
          ): Promise<boolean> {
            const adjusted = await fetchNasdaqOneDay(symbol, expected.date)
            if (!adjusted) return false
            const rawMatch = barsPriceEqual(adjusted, expected)
            const restoredMatch = barsPriceEqual(
              fullyUnadjustedCandidateBar(context.asset.id, adjusted),
              expected,
            )
            if (!rawMatch && !restoredMatch) return false
            return nasdaqCandidateMatches(context.asset.id, symbol, context.prices)
          }

          async function saveResolvedNasdaq(
            context: AssetIdentityContext,
            symbol: string,
            sourceMap: PrivateSourceMapFile,
          ): Promise<void> {
            const source = sourceMap.assets[context.asset.id]
            source.provider = 'NASDAQ'
            source.assetClass = 'stocks'
            source.symbol = symbol
            delete source.candidates
            console.log(`Resolved official Nasdaq tracked identity for ${context.asset.id}`)
            await checkpointSourceMap(sourceMap, context.asset.id)
          }

          async function resolveNasdaqContext(
            context: AssetIdentityContext,
            screenerRows: NasdaqScreenerRow[],
            sourceMap: PrivateSourceMapFile,
          ): Promise<void> {
            const expected = context.prices.bars.at(-1)!
            for (const symbol of NASDAQ_CANDIDATE_HINTS[context.asset.id] ?? []) {
              if (await verifiedCandidate(context, symbol, expected)) {
                await saveResolvedNasdaq(context, symbol, sourceMap)
                return
              }
            }

            const resolutionDate = expected.date
            const resolutionYear = Number(resolutionDate.slice(0, 4))
            const targetClose = expected.close
            const baseCandidates = screenerRows.flatMap((row) => {
              const symbol = typeof row.symbol === 'string' ? row.symbol.trim() : ''
              if (!symbol || symbol.length > 12 || !/^[A-Z0-9./-]+$/i.test(symbol)) return []
              const ipoYear = parseIpoYear(row.ipoyear)
              if (ipoYear !== null && ipoYear > resolutionYear) return []
              return [{ symbol, lastSale: parseDollar(row.lastsale) }]
            })
            const seen = new Set(NASDAQ_CANDIDATE_HINTS[context.asset.id] ?? [])
            const tolerances = [0.005, 0.015, 0.04, 0.1, 0.25, Number.POSITIVE_INFINITY]
            for (const tolerance of tolerances) {
              const candidates = baseCandidates
                .filter((candidate) => {
                  if (seen.has(candidate.symbol)) return false
                  if (!Number.isFinite(tolerance)) return true
                  if (candidate.lastSale === null) return false
                  return Math.abs(candidate.lastSale - targetClose) / targetClose <= tolerance
                })
                .sort((left, right) => {
                  const leftDistance = left.lastSale === null ? Number.POSITIVE_INFINITY : Math.abs(left.lastSale - targetClose)
                  const rightDistance = right.lastSale === null ? Number.POSITIVE_INFINITY : Math.abs(right.lastSale - targetClose)
                  return leftDistance - rightDistance
                })
              console.log(`${context.asset.id}: probing ${candidates.length} new Nasdaq candidates at tolerance ${tolerance}`)
              const shortlist: string[] = []
              await mapLimit(candidates, 12, async (candidate) => {
                seen.add(candidate.symbol)
                const adjusted = await fetchNasdaqOneDay(candidate.symbol, resolutionDate)
                if (!adjusted) return
                const rawMatch = barsPriceEqual(adjusted, expected)
                const restoredMatch = barsPriceEqual(
                  fullyUnadjustedCandidateBar(context.asset.id, adjusted),
                  expected,
                )
                if (rawMatch || restoredMatch) shortlist.push(candidate.symbol)
              })
              for (const symbol of [...new Set(shortlist)]) {
                if (!await nasdaqCandidateMatches(context.asset.id, symbol, context.prices)) continue
                await saveResolvedNasdaq(context, symbol, sourceMap)
                return
              }
            }
            throw new Error(`${context.asset.id}: official Nasdaq full-history identity was not resolved`)
          }

          async function loadContexts'''
          pattern = r"async function resolveNasdaqGroup\([\s\S]*?\n\}\n\nasync function loadContexts"
          text, count = re.subn(pattern, lambda _match: replacement, text, count=1)
          if count != 1:
              raise SystemExit('Nasdaq resolver replacement point missing')

          bottom_pattern = r"const sourceMap = JSON\.parse\(await readFile\(SOURCE_MAP_PATH, 'utf8'\)\) as PrivateSourceMapFile[\s\S]*$"
          bottom = r'''const sourceMap = JSON.parse(await readFile(SOURCE_MAP_PATH, 'utf8')) as PrivateSourceMapFile
          if (sourceMap.schemaVersion !== 1) throw new Error('Tracked source map schema mismatch')
          const usContexts = await loadContexts((asset) =>
            asset.market === 'US'
            && asset.kind === 'stock'
            && sourceMap.assets[asset.id]?.symbol === 'DUMMY'
          )
          const screenerRows = await fetchNasdaqUniverse()
          console.log(`Nasdaq official screener returned ${screenerRows.length} rows`)
          for (const context of usContexts) await resolveNasdaqContext(context, screenerRows, sourceMap)
          const unresolved = Object.entries(sourceMap.assets)
            .filter(([assetId, source]) => /^U\d{3}$/.test(assetId) && source.symbol === 'DUMMY')
            .map(([assetId]) => assetId)
          if (unresolved.length > 0) throw new Error(`Unresolved U.S. tracked mappings: ${unresolved.length}`)
          console.log('Resolved all 45 U.S. tracked mappings from official Nasdaq history.')
          '''
          text, count = re.subn(bottom_pattern, lambda _match: bottom, text, count=1)
          if count != 1:
              raise SystemExit('Nasdaq resolver main replacement point missing')
          path.write_text(text)
          PY

      - name: Resolve and checkpoint U.S. mappings
        run: npx tsx .github/tmp-resolve-market-map.ts

      - name: Verify 45 U.S. mappings
        run: |
          node - <<'NODE'
          const map = require('./config/market-source-map.json')
          const us = Object.entries(map.assets).filter(([id]) => /^U\d{3}$/.test(id))
          const unresolved = us.filter(([, source]) => source.symbol === 'DUMMY')
          if (us.length !== 45 || unresolved.length !== 0) throw new Error(`US mapping incomplete: total=${us.length} unresolved=${unresolved.length}`)
          console.log('Tracked source map contains all 45 U.S. mappings.')
          NODE
