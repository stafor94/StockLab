name: Inspect KIND listed-share row structure

on:
  push:
    branches: [feature/keyless-market-cap-97]

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Inspect detail modes for multi-class stock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html, re, subprocess
          from urllib.parse import urlencode

          base='https://kind.krx.co.kr'
          init=subprocess.check_output(['curl','-sS','--max-time','30','-A','Mozilla/5.0',base+'/corpgeneral/listedIssueStatus.do?method=loadInitPage']).decode('euc-kr','replace')
          for line in init.splitlines():
              if 'detailType' in line or '상장주식수' in line or 'secugrpId' in line:
                  cleaned=' '.join(html.unescape(re.sub(r'<[^>]+>',' ',line)).split())
                  if cleaned: print('INIT', cleaned[:240])

          url=base+'/corpgeneral/listedissuestatusdetail.do'
          for detail in ('1','2','3','4'):
              data=urlencode({
                  'method':'searchListedIssueStatDetailSub',
                  'forward':'listedissuestatdetail_down',
                  'currentPageSize':'3000',
                  'pageIndex':'1',
                  'mktId':'STK',
                  'secugrpId':'ST',
                  'detailType':detail,
                  'selDate':'20190102',
              })
              raw=subprocess.check_output(['curl','-sS','--max-time','30','-A','Mozilla/5.0','-H','Referer: '+base+'/corpgeneral/listedIssueStatus.do?method=loadInitPage','-X','POST',url,'--data',data])
              text=raw.decode('euc-kr','replace')
              headers=[]
              for cell in re.findall(r'<th[^>]*>(.*?)</th>', text, re.I|re.S):
                  cleaned=' '.join(html.unescape(re.sub(r'<[^>]+>',' ',cell)).split())
                  if cleaned: headers.append(cleaned)
              hits=[]
              for tr in re.findall(r'<tr[^>]*>(.*?)</tr>', text, re.I|re.S):
                  cells=[]
                  for cell in re.findall(r'<td[^>]*>(.*?)</td>', tr, re.I|re.S):
                      cleaned=' '.join(html.unescape(re.sub(r'<[^>]+>',' ',cell)).split())
                      cells.append(cleaned)
                  if any(code in cells for code in ('005930','005935')) or any('삼성전자' in cell for cell in cells): hits.append(cells)
              print('DETAIL',detail,'headers=',headers[:20],'hits=',hits[:10])
          PY
