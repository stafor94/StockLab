name: Resolve US tracked mappings incrementally v5

on:
  push:
    branches: [feature/keyless-market-cap-97-us-map]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-us:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Configure persistence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Inspect Nasdaq date query behavior
        run: npx tsx .github/tmp-debug-nasdaq-date.ts
      - name: Resolve and checkpoint verified U.S. mappings
        run: npx tsx .github/tmp-resolve-us-hints.ts
      - name: Report U.S. mapping coverage
        run: |
          node - <<'NODE'
          const map = require('./config/market-source-map.json')
          const us = Object.entries(map.assets).filter(([id]) => /^U\d{3}$/.test(id))
          const resolved = us.filter(([, source]) => source.symbol !== 'DUMMY')
          console.log(`U.S. tracked mappings resolved: ${resolved.length}/45`)
          NODE
