name: Resolve tracked market source map v35

on:
  push:
    branches: [feature/keyless-market-cap-97]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-market-source-map:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KRX_KIND_REQUEST_DELAY_MS: '120'
      NASDAQ_REQUEST_DELAY_MS: '100'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 8

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Patch resolver for tracked source map
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/tmp-resolve-market-map.ts')
          text = path.read_text()

          text = text.replace(
              "const SOURCE_MAP_PATH = join(ROOT, '.private', 'market-source-map.json')",
              "const SOURCE_MAP_PATH = join(ROOT, 'config', 'market-source-map.json')",
              1,
          )
          text = text.replace("'User-Agent': 'StockLab private identity resolver'", "'User-Agent': 'StockLab tracked identity resolver'", 1)
          text = text.replace(' && left.volume === right.volume', '')
          text = text.replace("detailType: '2'", "detailType: '1'", 1)
          text = text.replace(
              "if (/^\\d{6}$/.test(trimmed)) return trimmed",
              "if (/^\\d{1,6}$/.test(trimmed)) return trimmed.padStart(6, '0')",
              1,
          )
          text = text.replace('for (let attempt = 0; attempt < 5; attempt += 1) {', 'for (let attempt = 0; attempt < 12; attempt += 1) {', 1)
          text = text.replace(
              'await new Promise((resolve) => setTimeout(resolve, 400 * (2 ** attempt)))',
              'await new Promise((resolve) => setTimeout(resolve, Math.min(10_000, 1_000 * (2 ** attempt))))',
              1,
          )

          issuer_pattern = r"async function getKrxIssuer\(symbol: string\): Promise<[^>]+> \{.*?\n\}\n\nasync function fetchKrxSample"
          issuer_replacement = '''async function getKrxIssuer(symbol: string): Promise<{ issuerCode: string; session: KrxKindSession } | null> {
            if (krxIssuerCache.has(symbol)) return krxIssuerCache.get(symbol) ?? null
            for (let attempt = 0; attempt < 4; attempt += 1) {
              try {
                const xml = await fetchKrxKindIssuerLookup(symbol, {
                  cacheRoot: CACHE_ROOT,
                  force: false,
                  delayMs: 60,
                })
                const issuer = parseKrxKindIssuerInfo(xml, symbol)
                const session = await openKrxKindSession(issuer.issuerCode, 60)
                const value = { issuerCode: issuer.issuerCode, session }
                krxIssuerCache.set(symbol, value)
                return value
              } catch {
                if (attempt < 3) await new Promise((resolve) => setTimeout(resolve, 250 * (2 ** attempt)))
              }
            }
            return null
          }

          async function fetchKrxSample'''
          text, count = re.subn(issuer_pattern, issuer_replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('KIND issuer retry patch insertion point missing')

          sample_pattern = r"async function fetchKrxSample\(symbol: string, date: string\): Promise<DailyBar \| null> \{.*?\n\}\n\nasync function mapLimit"
          sample_replacement = '''async function fetchKrxSample(symbol: string, date: string): Promise<DailyBar | null> {
            const key = `${symbol}:${date}`
            if (krxSampleCache.has(key)) return krxSampleCache.get(key) ?? null
            const issuer = await getKrxIssuer(symbol)
            if (!issuer) return null
            for (let attempt = 0; attempt < 4; attempt += 1) {
              try {
                const response = await fetchKrxKindHistoricalResponse({
                  symbol,
                  issuerCode: issuer.issuerCode,
                  from: date,
                  to: date,
                  session: issuer.session,
                  cacheRoot: CACHE_ROOT,
                  force: false,
                  delayMs: 60,
                })
                const bar = normalizeKrxKindHistoricalResponse(response, { from: date, to: date })[0] ?? null
                krxSampleCache.set(key, bar)
                return bar
              } catch {
                if (attempt < 3) await new Promise((resolve) => setTimeout(resolve, 250 * (2 ** attempt)))
              }
            }
            return null
          }

          async function mapLimit'''
          text, count = re.subn(sample_pattern, sample_replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('KIND history retry patch insertion point missing')

          kr_prefix_old = '''  const firstDate = contexts[0].prices.bars[0].date
            const kind = contexts[0].asset.kind
            const universe = await fetchKrxUniverse(firstDate, kind)
            console.log(`KRX official universe scan for ${kind} ${firstDate}: ${universe.length} candidates`)
            const matches = new Map(contexts.map((context) => [context.asset.id, [] as KrxUniverseEntry[]]))
            await mapLimit(universe, 6, async (entry) => {
              const actual = await fetchKrxSample(entry.symbol, firstDate)
              if (!actual) return
              for (const context of contexts) {
                if (barsPriceEqual(actual, context.prices.bars[0])) matches.get(context.asset.id)!.push(entry)
              }
            })'''
          kr_prefix_new = '''  const kind = contexts[0].asset.kind
            const commonDates = contexts[0].prices.bars
              .map((bar) => bar.date)
              .filter((date) => contexts.every((context) => context.prices.bars.some((bar) => bar.date === date)))
            let resolutionDate: string | null = null
            let universe: KrxUniverseEntry[] = []
            for (const date of commonDates.slice(0, 8)) {
              try {
                universe = await fetchKrxUniverse(date, kind)
                resolutionDate = date
                break
              } catch {
                // Try a later official trading date.
              }
            }
            if (!resolutionDate) throw new Error(`KRX KIND universe unavailable for ${kind} supported identity group`)
            console.log(`KRX official universe scan for ${kind} ${resolutionDate}: ${universe.length} candidates`)
            const matches = new Map(contexts.map((context) => [context.asset.id, [] as KrxUniverseEntry[]]))
            await mapLimit(universe, 3, async (entry) => {
              const actual = await fetchKrxSample(entry.symbol, resolutionDate!)
              if (!actual) return
              for (const context of contexts) {
                const expected = context.prices.bars.find((bar) => bar.date === resolutionDate)
                if (expected && barsPriceEqual(actual, expected)) matches.get(context.asset.id)!.push(entry)
              }
            })'''
          if text.count(kr_prefix_old) != 1:
              raise SystemExit('KR common-date patch insertion point missing')
          text = text.replace(kr_prefix_old, kr_prefix_new, 1)

          venue_old = '''  const initial = source.endpoint
            if (initial !== 'stk_bydd_trd' && initial !== 'ksq_bydd_trd') return
            const bars = context.prices.bars
            const finalVenue = await krxVenueOnDate(source.symbol, bars.at(-1)!.date)'''
          venue_new = '''  const bars = context.prices.bars
            let initial: 'stk_bydd_trd' | 'ksq_bydd_trd' | null = null
            for (const bar of bars.slice(0, 8)) {
              try {
                initial = await krxVenueOnDate(source.symbol, bar.date)
              } catch {
                // Try the next actual price date.
              }
              if (initial) break
            }
            if (!initial) throw new Error(`${context.asset.id}: official KRX venue resolution unavailable near listing start`)
            source.endpoint = initial
            source.endpointChanges = []
            const finalVenue = await krxVenueOnDate(source.symbol, bars.at(-1)!.date)'''
          if text.count(venue_old) != 1:
              raise SystemExit('KR venue patch insertion point missing')
          text = text.replace(venue_old, venue_new, 1)

          persist_marker = 'async function loadContexts(filter: (asset: CatalogAsset) => boolean): Promise<AssetIdentityContext[]> {'
          persist_helper = '''async function persistSourceMap(sourceMap: PrivateSourceMapFile): Promise<void> {
            await writeFile(SOURCE_MAP_PATH, `${JSON.stringify(sourceMap, null, 2)}\\n`)
          }

          ''' + persist_marker
          if text.count(persist_marker) != 1:
              raise SystemExit('persist helper insertion point missing')
          text = text.replace(persist_marker, persist_helper, 1)

          us_date_old = '''  const firstDate = contexts[0].prices.bars[0].date
            const firstYear = Number(firstDate.slice(0, 4))'''
          us_date_new = '''  const commonDates = contexts[0].prices.bars
              .map((bar) => bar.date)
              .filter((date) => contexts.every((context) => context.prices.bars.some((bar) => bar.date === date)))
            const resolutionDate = commonDates.at(-1)
            if (!resolutionDate) throw new Error('No common Nasdaq trading date for supported identity group')
            const resolutionYear = Number(resolutionDate.slice(0, 4))'''
          if text.count(us_date_old) != 1:
              raise SystemExit('Nasdaq latest common-date insertion point missing')
          text = text.replace(us_date_old, us_date_new, 1)
          text = text.replace('ipoYear > firstYear', 'ipoYear > resolutionYear', 1)
          text = text.replace('`Nasdaq official universe scan for ${firstDate}: ${candidates.length} candidates`', '`Nasdaq official universe scan for ${resolutionDate}: ${candidates.length} candidates`', 1)
          text = text.replace('    const adjusted = await fetchNasdaqOneDay(symbol, firstDate)', '    const adjusted = await fetchNasdaqOneDay(symbol, resolutionDate)', 1)
          text = text.replace(
              '      const rawMatch = barsPriceEqual(adjusted, context.prices.bars[0])',
              "      const expected = context.prices.bars.find((bar) => bar.date === resolutionDate)\n      if (!expected) continue\n      const rawMatch = barsPriceEqual(adjusted, expected)",
              1,
          )
          text = text.replace(
              '        fullyUnadjustedCandidateBar(context.asset.id, adjusted),\n        context.prices.bars[0],',
              '        fullyUnadjustedCandidateBar(context.asset.id, adjusted),\n        expected,',
              1,
          )
          text = text.replace(
              '    console.log(`Resolved official Nasdaq private identity for ${context.asset.id}`)',
              '    console.log(`Resolved official Nasdaq tracked identity for ${context.asset.id}`)\n    await persistSourceMap(sourceMap)',
              1,
          )
          text = text.replace('Resolved official KRX private identity', 'Resolved official KRX tracked identity')

          bottom_pattern = r"const sourceMap = JSON\.parse\(await readFile\(SOURCE_MAP_PATH, 'utf8'\)\) as PrivateSourceMapFile.*?console\.log\('Resolved exactly 97 supported private identities from official exchange data\.'\)"
          bottom_replacement = '''const sourceMap = JSON.parse(await readFile(SOURCE_MAP_PATH, 'utf8')) as PrivateSourceMapFile
          if (sourceMap.schemaVersion !== 1) throw new Error('Tracked source map schema mismatch')
          const scope = process.env.RESOLVE_SCOPE ?? 'ALL'

          if (scope === 'KR' || scope === 'ALL') {
            const krContexts = await loadContexts((asset) =>
              asset.market === 'KR' && sourceMap.assets[asset.id]?.symbol === '000000'
            )
            const krGroups = [
              krContexts.filter((context) => context.asset.kind === 'stock'),
              krContexts.filter((context) => context.asset.kind === 'etf'),
            ].filter((group) => group.length > 0)
            for (const group of krGroups) await resolveKrxGroup(group, sourceMap)
            for (const context of krContexts) {
              await resolveKrxVenueChanges(context, sourceMap.assets[context.asset.id])
            }
            await persistSourceMap(sourceMap)
          }

          if (scope === 'US' || scope === 'ALL') {
            const usContexts = await loadContexts((asset) =>
              asset.market === 'US'
              && asset.kind === 'stock'
              && sourceMap.assets[asset.id]?.symbol === 'DUMMY'
            )
            if (usContexts.length > 0) {
              const screenerRows = await fetchNasdaqUniverse()
              console.log(`Nasdaq official screener returned ${screenerRows.length} rows`)
              await resolveNasdaqGroup(usContexts, screenerRows, sourceMap)
              await persistSourceMap(sourceMap)
            }
          }

          const unresolved = Object.entries(sourceMap.assets)
            .filter(([, source]) => source.symbol === '000000' || source.symbol === 'DUMMY')
            .map(([assetId]) => assetId)
          console.log(`Tracked market source map unresolved slots: ${unresolved.length}`)'''
          text, count = re.subn(bottom_pattern, bottom_replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('tracked source-map main patch insertion point missing')

          path.write_text(text)
          PY

      - name: Resolve Korean tracked mappings
        env:
          RESOLVE_SCOPE: KR
        run: npx tsx .github/tmp-resolve-market-map.ts

      - name: Persist Korean mappings
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- config/market-source-map.json; then
            git add config/market-source-map.json
            git commit -m 'data: persist official KR market source mappings'
            git push origin HEAD:feature/keyless-market-cap-97
          fi

      - name: Resolve U.S. tracked mappings
        id: resolve_us
        continue-on-error: true
        env:
          RESOLVE_SCOPE: US
        run: npx tsx .github/tmp-resolve-market-map.ts

      - name: Persist U.S. mappings
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- config/market-source-map.json; then
            git add config/market-source-map.json
            git commit -m 'data: persist official US market source mappings'
            git push origin HEAD:feature/keyless-market-cap-97
          fi

      - name: Require U.S. resolver success
        if: steps.resolve_us.outcome != 'success'
        run: exit 1
